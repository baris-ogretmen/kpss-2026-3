    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.development.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Fredoka:wght@500;600&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #f8fafc; color: #1e293b; margin: 0; overflow: hidden; }
        .brand { font-family: 'Fredoka', sans-serif; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .loader { border: 4px solid #e2e8f0; border-top: 4px solid #6366f1; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .anim-fade { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Renkli vurgular */
        .readable-text strong { color: #e11d48; font-weight: 900; background: #ffe4e6; padding: 2px 6px; border-radius: 6px; border: 1px solid #fda4af; }
        .readable-text em { background-color: #fef08a; color: #854d0e; font-style: normal; padding: 2px 6px; border-radius: 6px; font-weight: 800; border: 1px dashed #eab308; }
        .readable-text ul { list-style-type: none; padding-left: 0.5rem; margin-bottom: 1.5rem; }
        .readable-text li { margin-bottom: 0.75rem; padding-left: 1.5rem; position: relative; font-weight: 600; color: #334155; }
        .readable-text li::before { content: "🎯"; position: absolute; left: 0; top: 0; font-size: 1rem; }
        .readable-text h3 { color: #1e3a8a; font-size: 1.5rem; font-weight: 900; margin-top: 2rem; margin-bottom: 1rem; border-bottom: 3px solid #bfdbfe; padding-bottom: 0.5rem; display: inline-block; }
        .readable-text table { width: 100%; border-collapse: separate; border-spacing: 0; margin: 1.5rem 0; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); border: 2px solid #e2e8f0; }
        .readable-text th { background-color: #4f46e5; color: white; padding: 14px; font-weight: 900; text-align: left; }
        .readable-text td { background-color: #f8fafc; padding: 14px; border-bottom: 1px solid #e2e8f0; font-weight: 600; color: #1e293b; }
        .readable-text tr:last-child td { border-bottom: none; }
        .readable-text tr:nth-child(even) td { background-color: #ffffff; }
        
        /* Kart Stili */
        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
    </style>
</head>
<body>

    <script type="text/babel">
        const { useState, useEffect } = React;

                units: [
                    {
                        id: 1, title: "Alan Eğitimi Temelleri", 
                        topics: ["1.1. Okul Öncesinde Fen Eğitimi", "1.2. Okul Öncesinde Matematik Eğitimi", "1.3. Okul Öncesinde Görsel Sanatlar", "1.4. Okul Öncesinde Müzik Eğitimi"]
                    },

                    },

                    }

            AGS: {

                color: "sky", // Mavi Tema
                units: [
                    {
                        id: 1, title: "Sözel Yetenek", 
                        topics: ["1.1. Sözcükte Anlam", "1.2. Cümlede Anlam", "1.3. Paragrafta Anlam", "1.4. Sözel Mantık"]
                    },
                    {
                        id: 2, title: "Sayısal Yetenek & İleri Matematik", 
                        topics: ["2.1. Temel Kavramlar ve Çözümleme", "2.2. Rasyonel ve Ondalık Sayılar", "2.3. Üslü Sayılar (Derinlemesine)", "2.4. Köklü Sayılar ve Eşlenik", "2.5. Mutlak Değer ve Eşitsizlikler", "2.6. Çarpanlara Ayırma ve Özdeşlikler", "2.7. Problemler (Yaş, İşçi, Hız vb.)", "2.8. Sayısal Mantık", "2.9. Grafik ve Tablo Yorumlama"]
                    },

                    },
                    {

                    },
                    {

                        topics: ["5.1. Gelişim Psikolojisi", "5.2. Öğrenme Psikolojisi", "5.3. Öğretim Yöntem ve Teknikleri", "5.4. Ölçme ve Değerlendirme", "5.5. Program Geliştirme", "5.6. Rehberlik"]
                    },

                        topics: ["6.1. Temel Hukuk ve Anayasa", "6.2. 1739 Sayılı Milli Eğitim Temel Kanunu", "6.3. 222 Sayılı İlköğretim Kanunu", "6.4. Öğretmenlik Mesleği Kanunu"]

        };

        const INSTRUCTORS = {
            'Tarih': ['Ramazan Yetgin', 'Aydın Yüce', 'Mehmet Celal Özyıldız'],
            'Coğrafya': ['Bayram Meral', 'Engin Eraydın'],
            'Vatandaşlık': ['Emrah Vahap Özkaraca'],
            'Matematik': ['İlyas Güneş'],
            'Eğitim': ['Metin Şar', 'Bülent Tanık', 'Cüneyt İltuş', 'Fatih Genç'],
            'ÖABT': ['Hilal Hoca', 'Okul Öncesi ÖABT TV', 'Sultan Hoca', 'Murat Sakin']
        };

        const Icon = ({ name, size=20, className="" }) => {
            useEffect(() => { if(window.lucide) window.lucide.createIcons(); });
            return <i data-lucide={name} className={className} style={{ width: size, height: size }}></i>;
        };

        const callGoogle = async (apiKey, modelName, prompt, type = 'json') => {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`;
            
            // API Body hazırlığı
            const requestBody = {
                contents: [{ parts: [{ text: prompt }] }]
            };

            // SORU ÜRETME PROBLEMİNİ ÇÖZEN KRİTİK KISIM
            if (type === 'json') {
                requestBody.generationConfig = {
                    responseMimeType: "application/json"
                };
            }

            try {
                const response = await fetch(url, { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify(requestBody) 
                });
                
                const data = await response.json();
                if (data.error) throw new Error(data.error.message);
                
                let text = data.candidates?.[0]?.content?.parts?.[0]?.text;
                if (!text) throw new Error("Cevap boş.");
                
                if (type === 'html') return text;
                
                // JSON Temizleme (Her ihtimale karşı temizlik yapıyoruz, ama generationConfig çoğu işi çözer)
                text = text.replace(/```json/g, '').replace(/```/g, '').trim();
                const s = text.indexOf('['); const e = text.lastIndexOf(']');
                if (s !== -1 && e !== -1) text = text.substring(s, e+1);
                
                return JSON.parse(text);
            } catch (e) { 
                console.error(e); 
                throw e; 
            }
        };

        // --- COMPONENTS ---

     const InfoModal = ({ data, close }) => (
            <div className="fixed inset-0 z-50 bg-slate-900/80 flex items-center justify-center p-4 anim-fade">
                <div className="bg-white rounded-[2rem] w-full max-w-3xl max-h-[85vh] flex flex-col shadow-2xl overflow-hidden">
                    <div className="p-6 bg-indigo-600 text-white flex justify-between items-center">
                        <h2 className="font-black text-xl">{data.title}</h2>
                        <button onClick={close} className="bg-white/20 hover:bg-white/40 p-2 rounded-full transition"><Icon name="x"/></button>
                    </div>
                    <div className="p-8 overflow-y-auto readable-text text-slate-800 text-lg leading-relaxed" dangerouslySetInnerHTML={{__html: data.content}}></div>
                </div>
            </div>
        );

        const Syllabus = ({ goBack, onAction, apiKey, modelName }) => {

            return (

                    <div className="flex justify-between items-center mb-6 max-w-5xl mx-auto w-full">

                        <div className="w-10"></div>
                    </div>
                    <div className="flex gap-3 overflow-x-auto max-w-5xl mx-auto w-full mb-8 hide-scroll pb-2">
                        {Object.entries(CURRICULUM).map(([k, v]) => (

                        ))}
                    </div>
                    <div className="flex-1 overflow-y-auto max-w-5xl mx-auto w-full space-y-6">
                        {CURRICULUM[activeTab].units.map(u => (

                                <div className="space-y-4">
                                    {u.topics.map((t, i) => (
                                        <div key={i} className="flex flex-col xl:flex-row xl:items-center justify-between bg-slate-50 p-5 rounded-2xl gap-4 border border-slate-200">

                                            <div className="flex flex-wrap gap-2">
                                                <button onClick={()=>onAction('hap', t)} className="flex-1 xl:flex-none px-4 py-2.5 bg-emerald-100 text-emerald-700 rounded-xl font-black text-sm hover:bg-emerald-200 transition shadow-sm"><Icon name="zap" size={16} className="inline mb-1 mr-1"/> Hap Bilgi</button>
                                                <button onClick={()=>onAction('ozet', t)} className="flex-1 xl:flex-none px-4 py-2.5 bg-blue-100 text-blue-700 rounded-xl font-black text-sm hover:bg-blue-200 transition shadow-sm"><Icon name="file-text" size={16} className="inline mb-1 mr-1"/> Özet</button>
                                                <button onClick={()=>onAction('hafiza', t)} className="flex-1 xl:flex-none px-4 py-2.5 bg-yellow-100 text-yellow-700 rounded-xl font-black text-sm hover:bg-yellow-200 transition shadow-sm"><Icon name="lightbulb" size={16} className="inline mb-1 mr-1"/> Hafıza Çivisi</button>
                                                <button onClick={()=>onAction('card', t)} className="flex-1 xl:flex-none px-4 py-2.5 bg-purple-100 text-purple-700 rounded-xl font-black text-sm hover:bg-purple-200 transition shadow-sm"><Icon name="copy" size={16} className="inline mb-1 mr-1"/> Kartlar</button>
                                                <button onClick={()=>onAction('duel', t)} className="flex-1 xl:flex-none px-4 py-2.5 bg-orange-100 text-orange-700 rounded-xl font-black text-sm hover:bg-orange-200 transition shadow-sm"><Icon name="swords" size={16} className="inline mb-1 mr-1"/> Düello</button>
                                                <button onClick={()=>onAction('test', t)} className="flex-1 xl:flex-none px-4 py-2.5 bg-rose-100 text-rose-700 rounded-xl font-black text-sm hover:bg-rose-200 transition shadow-sm"><Icon name="target" size={16} className="inline mb-1 mr-1"/> Mini Test</button>

       const Dashboard = ({ apiKey, setApiKey, modelName, setModelName, changeView, daysLeft, stats, handleAction }) => {
            const [keyInput, setKeyInput] = useState(apiKey || "");
            const [modelInput, setModelInput] = useState(modelName || "gemini-2.5-flash-preview-09-2025");
            const [keyStatus, setKeyStatus] = useState(apiKey ? 'valid' : 'idle'); 

            // Risk Analizi: En çok hata yapılan konuyu bulur
            const riskliKonu = Object.keys(stats || {}).length > 0 
                ? Object.keys(stats).reduce((a, b) => stats[a] > stats[b] ? a : b) 
                : null;

            const saveKey = async () => { 
                if(!keyInput.trim()) return alert("Lütfen anahtarı kutuya yapıştır!");
                if(!modelInput.trim()) return alert("Lütfen geçerli bir model adı gir!");
                
                setKeyStatus('checking');
                try {
                    await callGoogle(keyInput.trim(), modelInput.trim(), "Merhaba", "html");
                    localStorage.setItem("baris_key", keyInput.trim()); 
                    localStorage.setItem("baris_model", modelInput.trim()); 
                    setApiKey(keyInput.trim()); 
                    setModelName(modelInput.trim());
                    setKeyStatus('valid');
                } catch (error) {
                    setKeyStatus('invalid');
                    alert("Bu anahtar veya model çalışmıyor! ❌");
                }
            };

            const getBorderColor = () => {
                if(keyStatus === 'valid') return 'border-emerald-500 bg-emerald-50';
                if(keyStatus === 'invalid') return 'border-red-500 bg-red-50';
                if(keyStatus === 'checking') return 'border-yellow-500 bg-yellow-50';
                return 'border-indigo-200 bg-white';
            };

            return (
                <div className="h-full overflow-y-auto p-4 md:p-8 flex flex-col items-center max-w-5xl mx-auto anim-fade hide-scroll">
                    
                    <div className="w-full flex flex-col md:flex-row items-center justify-between bg-white rounded-[2.5rem] p-6 shadow-xl border-4 border-slate-50 mb-6 gap-6">
                        <div className="flex items-center gap-6 w-full md:w-auto">

                                <span className="text-[11px] font-black uppercase tracking-widest opacity-90 mb-1">Sınava Kalan</span>
                                <span className="text-3xl font-black brand leading-none">{daysLeft} Gün</span>
                            </div>
                            <div>
                                <h1 className="text-3xl font-black text-slate-800 brand leading-tight">DENEME ÜSSÜ</h1>
                                <div className="text-indigo-600 font-black text-sm tracking-widest uppercase">Barış Akademi V50</div>
                            </div>
                        </div>

                        <div className={`flex flex-col lg:flex-row items-center gap-3 p-3 rounded-3xl border-4 transition w-full md:w-auto shadow-sm ${getBorderColor()}`}>
                            <div className="flex items-center w-full">
                                <Icon name="cpu" size={20} className="text-slate-400 hidden lg:block ml-3 mr-2"/>
                                <input value={keyInput} onChange={e=>{setKeyInput(e.target.value); setKeyStatus('idle');}} type="password" placeholder="API Anahtarı" className="w-full lg:w-32 bg-transparent text-sm font-mono outline-none border-b lg:border-b-0 lg:border-r border-slate-300 p-2 lg:p-1"/>
                            </div>
                            <input value={modelInput} onChange={e=>setModelInput(e.target.value)} className="w-full lg:w-48 bg-transparent text-sm font-bold text-slate-700 outline-none p-2 lg:p-1 text-center lg:text-left" placeholder="Model Adı"/>
                            <button onClick={saveKey} className={`w-full lg:w-auto px-6 py-3 rounded-2xl text-sm font-black text-white shadow-md transition ${keyStatus==='valid'?'bg-emerald-500':'bg-indigo-600 hover:bg-indigo-700'}`}>
                                {keyStatus==='checking' ? '...' : keyStatus==='valid' ? 'BAĞLI ✅' : 'BAĞLAN'}
                            </button>
                        </div>
                    </div>

                    {/* BARIŞ HOCA ÖZEL: RİSK ALARMI PANELI */}
                    {riskliKonu && (
                        <div className="w-full bg-red-50 border-4 border-red-200 rounded-[2.5rem] p-6 mb-8 flex flex-col md:flex-row items-center justify-between shadow-sm anim-fade relative overflow-hidden">
                            <div className="absolute -right-4 -top-4 text-red-100 opacity-50"><Icon name="siren" size={120} /></div>
                            <div className="flex items-center gap-4 relative z-10 w-full md:w-auto mb-4 md:mb-0">
                                <div className="bg-red-500 text-white p-4 rounded-full animate-pulse shadow-md"><Icon name="alert-triangle" size={32}/></div>
                                <div>
                                    <h3 className="font-black text-red-800 text-lg">Kritik Risk Tespit Edildi!</h3>
                                    <p className="text-red-600 text-sm font-bold">Önceki denemelerde <strong className="bg-red-200 px-2 rounded">"{riskliKonu}"</strong> konusunda çok hata yaptınız.</p>
                                </div>
                            </div>

                            </div>

                    <div className="w-full flex justify-end mb-4">

                            <span className="font-black text-white text-2xl tracking-widest z-10 text-center">MÜFREDAT</span>

                        </button>
                        <button onClick={()=>changeView('trial_setup')} className="bg-gradient-to-br from-indigo-600 to-purple-700 p-8 rounded-[2.5rem] shadow-xl hover:shadow-2xl hover:-translate-y-2 transition-all group flex flex-col items-center gap-4 relative overflow-hidden border-4 border-white">
                            <div className="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] opacity-10"></div>
                            <div className="bg-white/20 text-white p-6 rounded-full group-hover:scale-110 transition z-10"><Icon name="rocket" size={48}/></div>

                    <div className="bg-white p-8 md:p-12 rounded-[3rem] shadow-2xl max-w-3xl mx-auto w-full border-4 border-indigo-50 relative overflow-hidden">

       const Quiz = ({ questions, goBack, addToErrors, isNotebook }) => {
            const [idx, setIdx] = useState(0);
            const [show, setShow] = useState(false);
            const [score, setScore] = useState(0);
            const q = questions[idx];
            
            const handleAns = (i) => { 
                if(show) return; 
                setShow(true); 
                if(i===q.ans) {
                    setScore(score+1); 
                } else {
                    addToErrors({q:q.q, w:q.opts[i], r:q.opts[q.ans], e:q.exp, t: isNotebook?"Defter":"Deneme"}); 
                }
            };
            
            return (
                <div className="h-full flex flex-col bg-slate-100 p-4 md:p-8 anim-fade">
                    <div className="flex justify-between items-center mb-6 max-w-7xl mx-auto w-full">
                        <button onClick={goBack} className="bg-white px-6 py-3 rounded-2xl font-black text-slate-600 hover:text-red-600 shadow-md transition">Sınavı Bitir</button>
                        <div className="bg-indigo-600 px-6 py-3 rounded-2xl font-black text-white shadow-md text-lg tracking-widest">SORU {idx+1} / {questions.length}</div>
                    </div>
                    <div className="flex-1 overflow-y-auto max-w-7xl mx-auto w-full hide-scroll pb-10">
                        
                        <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">

                                </div>
                                
                                <div className="space-y-3">
                                    {q.opts.map((o,i)=>
                                        <button key={i} onClick={()=>handleAns(i)} disabled={show} className={`w-full text-left p-5 rounded-[2rem] border-4 font-bold text-lg transition-all shadow-sm ${show?(i===q.ans?'border-emerald-500 bg-emerald-50 text-emerald-800':i!==q.ans&&'opacity-40 bg-white border-slate-100 text-slate-400'):'border-white bg-white text-slate-700 hover:border-indigo-300 hover:shadow-md'}`}>
                                            <span className={`inline-flex items-center justify-center w-8 h-8 rounded-full mr-4 text-sm ${show&&i===q.ans?'bg-emerald-500 text-white':'bg-slate-100 text-slate-500'}`}>{String.fromCharCode(65+i)}</span>
                                            {o}
                                        </button>
                                    )}
                                </div>

                                {show && 
                                    <div className="mt-8 p-8 bg-indigo-50 border-4 border-indigo-200 rounded-[3rem] text-slate-800 shadow-xl anim-fade relative overflow-hidden">
                                        <div className="absolute top-0 right-0 bg-indigo-200 text-indigo-800 font-black text-[10px] px-4 py-2 rounded-bl-2xl uppercase tracking-widest"><Icon name="brain" size={14} className="inline mb-0.5 mr-1"/> Çözüm</div>

                                    </div>
                                }

                                    <h3 className="text-xl font-black text-amber-900 mt-6 mb-4 flex items-center"><Icon name="history" className="mr-2 text-amber-600"/> Çıkmış Soru Simülasyonu</h3>
                                    <p className="text-amber-800 font-semibold leading-relaxed mb-6 whitespace-pre-wrap">{q.osym_q || "Bu konudan çıkmış benzer bir soru simülasyonu yükleniyor..."}</p>
                                    
                                    <div className="bg-white p-6 rounded-3xl border-2 border-amber-100 shadow-sm">
                                        <h4 className="text-sm font-black text-rose-600 uppercase tracking-widest mb-3 flex items-center"><Icon name="alert-triangle" size={16} className="mr-2"/> ÖSYM Tuzağı</h4>
                                        <p className="text-slate-700 font-medium text-sm leading-relaxed">{q.osym_analizi || "ÖSYM'nin bu formattaki klasik tuzak ve çeldiricilerine dikkat edin."}</p>
                                    </div>
                                </div>
                            </div>

                    </div>

                                {idx<questions.length-1 ? 'SIRADAKİ SORU' : 'SONUÇLARI GÖR'} <Icon name="arrow-right" size={28}/>
                            </button>
                        </div>

            return (
                <div className="h-full flex flex-col bg-slate-100 p-6 anim-fade">

                    <div className="flex-1 w-full max-w-md mx-auto perspective-1000 mb-8" onClick={()=>setFlipped(!flipped)}>

                        <button onClick={()=>{setIdx(Math.min(cards.length-1,idx+1));setFlipped(false)}} disabled={idx===cards.length-1} className="flex-1 bg-slate-800 text-white py-5 rounded-2xl font-black shadow-md hover:bg-black disabled:opacity-50">İleri <Icon name="arrow-right" className="inline ml-2"/></button>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [view, setView] = useState('dashboard');
            const [apiKey, setApiKey] = useState(localStorage.getItem('baris_key') || "");
            const [modelName, setModelName] = useState(localStorage.getItem('baris_model') || "gemini-2.5-flash-preview-09-2025");
            const [loading, setLoading] = useState(false);
            const [modalData, setModalData] = useState(null); 
            const [quizData, setQuizData] = useState([]);
            const [cardData, setCardData] = useState([]);
            const [errors, setErrors] = useState(JSON.parse(localStorage.getItem('baris_errors')||'[]'));
            const [stats, setStats] = useState(JSON.parse(localStorage.getItem('baris_stats')||'{}'));
            const [lastStudied, setLastStudied] = useState(JSON.parse(localStorage.getItem('baris_last_study')||'{}'));
            const [activeTopic, setActiveTopic] = useState("Genel");

            const daysLeft = Math.ceil((new Date('2026-07-12') - new Date()) / (1000 * 60 * 60 * 24));
            
            useEffect(()=>{
                localStorage.setItem('baris_errors', JSON.stringify(errors));
                localStorage.setItem('baris_stats', JSON.stringify(stats));
                localStorage.setItem('baris_last_study', JSON.stringify(lastStudied));
            },[errors, stats, lastStudied]);

            const trackError = (topic) => {
                const newStats = {...stats};
                const key = topic.split('.')[0].trim();
                newStats[key] = (newStats[key] || 0) + 1;
                setStats(newStats);
            };

            const recordStudy = (topic) => {
                const newLast = {...lastStudied};
                newLast[topic] = new Date().toISOString();
                setLastStudied(newLast);
            };

            const handleAction = async (type, topic) => {
                if(!apiKey) return alert("Hocam önce ayarlardan API anahtarını bağlayalım!");
                setLoading(true);
                setActiveTopic(topic);
                recordStudy(topic);
                try {
                    let prompt = "";
                    const renkliKural = "HTML etiketleri kullan. <strong> (önemli yerler için), <em> (uyarılar için) etiketlerini bolca kullanarak metni rengarenk, vurgulu ve görsel olarak akılda kalıcı yap. Maddeleri <ul> ve <li> ile yaz.";
                    
                    if(type==='hap') prompt = `Konu: '${topic}'. KPSS/ÖABT için ÖSYM'nin en çok sorduğu, çeldiricisi en yüksek 5 kritik 'Atama Getiren' bilgi. ${renkliKural}`;
                    if(type==='ozet') prompt = `Konu: '${topic}'. Okul Öncesi ÖABT derinliğinde detaylı özet. Sıkıcı düz metinler yazma. ${renkliKural} Ana başlıkları <h3> yap.`;
                    if(type==='card') prompt = `Konu: '${topic}'. Bu konuda en çok karıştırılan kavram çiftleri. JSON Array: [{"front":"...", "back":"..."}]`;
                    if(type==='test') prompt = `Konu: '${topic}'. Tam ÖSYM standardında, öncüllü (I, II, III) ve zor 5 soru. SADECE JSON: [{"q":"...","opts":["..."],"ans":0,"exp":"..."}]`;
                    if(type==='duel') prompt = `Konu: '${topic}'. Bu kavramın 'en çok karıştırıldığı' rakip kavramı bul. İkisi arasındaki hayati farkları, ÖSYM'nin tuzaklarını <table>, <tr>, <th>, <td> etiketleri ile çok şık bir tablo olarak çiz. ${renkliKural}`;
                    if(type==='hafiza') prompt = `Konu: '${topic}'. Bu konuyu ezberlemek için KPSS/ÖABT öğrencilerinin kullandığı absürt, komik, akılda kalıcı akrostişler, şifreler veya 'Hafıza Çivileri' üret. ${renkliKural}`;
                    if(type==='ags_logic') prompt = `Barış Hocam için AGS tarzı bir 'Sözel Mantık' kurgusu hazırla. Hikaye, öncüller ve 4 adet soru olsun. Çözümde tabloyu nasıl kurması gerektiğini de anlat. ${renkliKural}`;

                    const res = await callGoogle(apiKey, modelName, prompt, (type==='card'||type==='test')?'json':'html');
                    
                    if(type==='hap'||type==='ozet'||type==='duel'||type==='ags_logic'||type==='hafiza') setModalData({type:'info', title: type==='hafiza' ? '🧠 Hafıza Çivisi: ' + topic : topic === 'AGS Sözel Mantık' ? 'AGS Mantık Atölyesi' : topic, content:res});
                    else if(type==='card') { setCardData(res); setView('flashcards'); }
                    else { setQuizData(res); setView('quiz'); }
                } catch(e) { alert("Yapay zeka yoruldu hocam, bir daha deneyelim!"); console.error(e); } finally { setLoading(false); }
            };

            const startTrial = async (conf) => {
                if(!apiKey) return alert("Anahtar giriniz!"); 
                if(!modelName) return alert("Model adı giriniz!");
                setLoading(true);
                setActiveTopic(conf.type);
                try {
                    const prompt = `Sen ordinaryüs profesör seviyesinde bir KPSS/ÖABT ve AGS uzmanısın. Alan: "${conf.type}". Seçilen stratejiye uygun "${conf.strategy}" zorluğunda ${conf.count} adet deneme sorusu yaz. 
                    MUAZZAM KURAL: Hazırladığın her deneme sorusu için bir de o konuya benzeyen 'Sınavda Çıkmış Soru Simülasyonu' (osym_q) ve ÖSYM'nin o konuda adayları nasıl elediğini anlatan 'ÖSYM Tuzağı Analizi' (osym_analizi) üreteceksin! 
                    SADECE JSON GÖNDER. Format: [{"q":"Ana Soru","opts":["A","B","C","D","E"],"ans":0,"exp":"HTML <strong>, <em>, <ul> ve emojiler kullanarak detaylıca açıkla.","osym_q":"Bu konuya benzer çıkmış veya çıkabilecek ÖSYM tarzı soru simülasyonu...","osym_analizi":"ÖSYM bu konuda öğrencileri hangi kelime oyunlarıyla veya mantıkla düşürür?"}]`;
                    const res = await callGoogle(apiKey, modelName, prompt, 'json');
                    setQuizData(res); setView('quiz');
                } catch(e) { alert("Hata oluştu."); } finally { setLoading(false); }

                    {view === 'syllabus' && <Syllabus apiKey={apiKey} modelName={modelName} goBack={()=>setView('dashboard')} onAction={handleAction}/>}
                    {view === 'trial_setup' && <TrialSetup goBack={()=>setView('dashboard')} startTrial={startTrial}/>}
                    {view === 'quiz' && <Quiz questions={quizData} goBack={()=>setView('dashboard')} addToErrors={err=>{setErrors([err,...errors]); trackError(activeTopic);}} isNotebook={false}/>}
                    {view === 'flashcards' && <Flashcards cards={cardData} goBack={()=>setView('syllabus')}/>}
                    
                    {view === 'errors' && 
                        <div className="h-full p-4 md:p-8 flex flex-col max-w-5xl mx-auto anim-fade">
                            <div className="flex justify-between items-center mb-8">
                                <button onClick={()=>setView('dashboard')} className="p-4 bg-white rounded-full shadow-md text-slate-600 hover:text-indigo-600 transition"><Icon name="arrow-left"/></button>
                                <h2 className="font-black text-3xl md:text-4xl text-slate-800 tracking-wider flex items-center"><Icon name="flame" size={36} className="text-red-500 mr-3"/> HATA DEFTERİM</h2>
                                <button onClick={()=>setErrors([])} className="bg-red-100 text-red-600 px-6 py-3 rounded-2xl font-black hover:bg-red-200 transition shadow-sm">Temizle</button>
                            </div>
                            <div className="flex-1 overflow-y-auto space-y-6 hide-scroll pb-10">
                                {errors.length === 0 ? 
                                    <div className="text-center text-slate-400 font-bold mt-20 flex flex-col items-center"><Icon name="check-circle" size={64} className="mb-4 opacity-50"/>Henüz kaydedilmiş bir hatan yok. Harika gidiyorsun!</div> : 
                                    errors.map((e,i)=>
                                        <div key={i} className="bg-white p-6 md:p-10 rounded-[3rem] border-4 border-slate-100 shadow-xl relative overflow-hidden">
                                            <div className="absolute top-0 left-10 w-12 h-16 bg-red-500 rounded-b-2xl flex items-end justify-center pb-2 text-white font-black">{i+1}</div>

                                                <div className="flex-1 bg-red-50 p-5 rounded-2xl border-2 border-red-100">
                                                    <div className="text-xs font-black text-red-400 uppercase tracking-widest mb-2 flex items-center"><Icon name="x-circle" size={14} className="mr-1"/> Senin Cevabın</div>
                                                    <div className="font-bold text-red-700 text-lg leading-tight">{e.w}</div>
                                                </div>
                                                <div className="flex-1 bg-emerald-50 p-5 rounded-2xl border-2 border-emerald-100">
                                                    <div className="text-xs font-black text-emerald-500 uppercase tracking-widest mb-2 flex items-center"><Icon name="check-circle" size={14} className="mr-1"/> Doğru Cevap</div>
                                                    <div className="font-bold text-emerald-700 text-lg leading-tight">{e.r}</div>
                                                </div>
                                            </div>
                                            <div className="bg-indigo-50 p-6 md:p-8 rounded-[2rem] border-2 border-indigo-100 relative">
                                                <div className="absolute -top-4 right-8 bg-indigo-500 text-white font-black text-[10px] px-4 py-2 rounded-full uppercase tracking-widest shadow-md">Zihin Haritası</div>
                                                <div className="text-indigo-900 text-base leading-relaxed readable-text" dangerouslySetInnerHTML={{__html: e.e}}></div>
                                            </div>
                                        </div>
                                    )
                                }
                            </div>
                        </div>
                    }
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
