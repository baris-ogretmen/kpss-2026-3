    <!-- ===== ZİRVE API KATMANI · şık modal panel + sınırsız görünür anahtar + otomatik model + 503 dayanıklılığı ===== -->
<script>
/* ============================================================
   ZİRVE API KATMANI  ·  çoklu anahtar + otomatik model + teşhis
   Uygulamanın kendi kodu DEĞİŞTİRİLMEDİ. Bu katman fetch'i sarar;
   generativelanguage.googleapis.com'a giden her isteği yakalar,
   anahtarı/modeli kendisi seçer, kota dolunca devreye girer.
   ============================================================ */
(function(){
"use strict";

// ---------- Depolama ----------
const LS = { keys:'zirve_keys', cool:'zirve_keycool', model:'baris_model', rpm:'zirve_rpm', legacy:'baris_key' };
const RING = { keys:[], cool:{}, aktif:null };
let KEY_MODELS = {};   // anahtar -> eriştiği model sayısı (Test Et'te öğrenilir)
try{ const r=localStorage.getItem('zirve_keymodels'); if(r) KEY_MODELS=JSON.parse(r)||{}; }catch(e){}
let MODEL = localStorage.getItem(LS.model) || 'gemini-2.5-flash';
let RPM = parseInt(localStorage.getItem(LS.rpm)||'8',10);

// Kotası kapanmış eski modelleri otomatik yükselt
const OLU_MODELLER = ['gemini-2.0-flash','gemini-2.0-flash-exp','gemini-2.0-flash-lite','gemini-1.5-flash','gemini-1.5-pro','gemini-pro','gemini-exp-1206'];
if (OLU_MODELLER.indexOf(MODEL) !== -1) { MODEL = 'gemini-2.5-flash'; localStorage.setItem(LS.model, MODEL); }

function ringSet(list){ RING.keys = list.map(x=>String(x||'').trim()).filter(k=>k.length>8); }
function ringLoad(){
  try{ const r=localStorage.getItem(LS.keys); if(r) ringSet(JSON.parse(r)); }catch(e){}
  if(!RING.keys.length){ const eski=localStorage.getItem(LS.legacy); if(eski) ringSet([eski]); }
  try{ const c=localStorage.getItem(LS.cool); if(c) RING.cool=JSON.parse(c); }catch(e){}
}
function ringSave(){
  try{
    localStorage.setItem(LS.keys, JSON.stringify(RING.keys));
    localStorage.setItem(LS.cool, JSON.stringify(RING.cool));
    // Uygulamanın kendi kontrolü (if(!apiKey) return) için ilk anahtarı eski yere de yaz
    if(RING.keys[0]) localStorage.setItem(LS.legacy, RING.keys[0]);
  }catch(e){}
}
// Kota Google'da MODEL BAZINDA tutulur → dinlenme kaydı "model|anahtar"
function coolKey(m,k){ return (m||'?')+'|'+k; }
function coolBitis(v){ return (v && typeof v==='object') ? (v.bitis||0) : (v||0); }
function coolGunluk(v){ return (v && typeof v==='object') ? !!v.gunluk : false; }
function ringHazir(m){ const n=Date.now(); return RING.keys.filter(k=>!(coolBitis(RING.cool[coolKey(m,k)])>n)); }
function coolInfo(m,k){ return RING.cool[coolKey(m,k)]; }
function ringPick(m){
  const h=ringHazir(m); if(!h.length) return null;
  if(RING.aktif && h.indexOf(RING.aktif)!==-1) return RING.aktif;
  RING.aktif=h[0]; return RING.aktif;
}
function ringNo(k){ return RING.keys.indexOf(k)+1; }
function ringCool(key, mesaj, m){
  const gunluk = /per day|PerDay|daily|GenerateRequestsPerDay/i.test(String(mesaj||''));
  let ms = 70000;                                  // dakikalık kota → ~70 sn
  if(gunluk){                                      // günlük kota → Pasifik gece yarısına kadar
    const now=new Date();
    const pt=new Date(now.toLocaleString('en-US',{timeZone:'America/Los_Angeles'}));
    const mid=new Date(pt); mid.setHours(24,0,0,0);
    ms=Math.max(60000, mid-pt);
  }
  RING.cool[coolKey(m,key)] = { bitis: Date.now()+ms, gunluk: gunluk }; ringSave();
  return gunluk;
}
function ringBekleme(m){
  const n=Date.now(); let en=Infinity;
  RING.keys.forEach(k=>{ const c=coolBitis(RING.cool[coolKey(m,k)]); if(c>n) en=Math.min(en,c-n); });
  if(en===Infinity) return '';
  const dk=Math.ceil(en/60000);
  return dk>60 ? Math.ceil(dk/60)+' saat' : dk+' dakika';
}

// ---------- Yedek model zinciri ----------
// Tercih sırası (hızlı/bol kotalı → yavaş/kısıtlı). Test Et'e basınca anahtarının
// GERÇEKTEN erişebildiği modeller öğrenilir ve zincir ona göre kurulur; böylece
// var olmayan bir model adına düşmeyiz.
const MODEL_TERCIH = [
  "gemini-2.5-flash-lite", "gemini-flash-lite-latest",
  "gemini-2.5-flash", "gemini-flash-latest",
  "gemini-2.0-flash-lite", "gemini-2.0-flash",
  "gemini-2.5-pro", "gemini-pro-latest"
];
let KULLANILABILIR = [];
try{ const r=localStorage.getItem('zirve_models'); if(r) KULLANILABILIR=JSON.parse(r)||[]; }catch(e){}

function modelHavuzu(){
  if(!KULLANILABILIR.length) return MODEL_TERCIH.slice();
  const havuz = MODEL_TERCIH.filter(m => KULLANILABILIR.indexOf(m)!==-1);
  // Listede olup tercihimizde olmayan flash modelleri de sona ekle (yeni çıkanlar için)
  KULLANILABILIR.forEach(m=>{
    if(havuz.indexOf(m)===-1 && /flash/.test(m) && !/thinking|exp|8b/.test(m)) havuz.push(m);
  });
  return havuz.length ? havuz : MODEL_TERCIH.slice();
}
function modelSonraki(simdiki, denenenler){
  return modelHavuzu().find(m => m!==simdiki && denenenler.indexOf(m)===-1) || null;
}

// ---------- Hız sınırlayıcı (kotayı boşa harcamamak için) ----------
const RL = { calisan:0, maxEs:2, gecmis:[] };
function rpmLimit(){ return RPM; }
async function rateGate(){
  while(true){
    const n=Date.now();
    RL.gecmis = RL.gecmis.filter(t=>n-t<60000);
    if(RL.calisan<RL.maxEs && RL.gecmis.length<rpmLimit()){ RL.calisan++; RL.gecmis.push(n); return; }
    await new Promise(r=>setTimeout(r,250));
  }
}
function rateRelease(){ RL.calisan=Math.max(0,RL.calisan-1); }

// ---------- Model ailesine göre generationConfig düzeltmeleri ----------
function aile(m){
  m=String(m||'');
  if(/gemini-3|gemini-flash-latest|gemini-flash-lite-latest|-latest$/.test(m)) return 'yeni';   // thinkingLevel ister
  if(/2\.5-(flash|flash-lite)/.test(m)) return 'flash25';                                       // thinkingBudget ister
  if(/pro/.test(m)) return 'pro';
  return 'diger';
}
// Gövde dönüşümleri: sırayla denenir, çalışan hatırlanır.
// ASIL ARIZA: Gemini 2.5+ modellerde "düşünme modu" varsayılan AÇIK. responseMimeType:json ve
// maxOutputTokens:16000 ile istek atılınca bütçe düşünmeye gidiyor, JSON YARIDA KESİLİYOR,
// uygulamanın JSON.parse'ı patlıyor ve hata catch{} ile yutulduğu için ekranda hiçbir şey olmuyor.
// Aşağıdaki varyantlar düşünmeyi kapatır/asgariye indirir.
function govdeVaryantlari(m){
  const f=aile(m);
  const temiz=(b)=>{ const c=JSON.parse(JSON.stringify(b)); if(c.generationConfig){ delete c.generationConfig.thinkingConfig; } return c; };
  const dusunme=(b,cfg)=>{ const c=temiz(b); c.generationConfig=Object.assign({}, c.generationConfig, {thinkingConfig:cfg}); return c; };
  // SON ÇARE: responseSchema'yı at. Şema devasa olduğunda model bazen tıkanıyor;
  // uygulamanın promptu istenen JSON biçimini zaten ayrıntısıyla anlatıyor, o yüzden şemasız da çalışır.
  const semasiz=(b,cfg)=>{ const c=dusunme(b,cfg); if(c.generationConfig) delete c.generationConfig.responseSchema; return c; };
  if(f==='yeni') return [
    (b)=>{ const c=dusunme(b,{thinkingLevel:"low"}); delete c.generationConfig.temperature; return c; },
    (b)=>{ const c=semasiz(b,{thinkingLevel:"low"}); delete c.generationConfig.temperature; return c; },
    (b)=>temiz(b), (b)=>b ];
  if(f==='flash25') return [
    (b)=>dusunme(b,{thinkingBudget:0}), (b)=>semasiz(b,{thinkingBudget:0}), (b)=>temiz(b), (b)=>b ];
  if(f==='pro') return [
    (b)=>dusunme(b,{thinkingBudget:128}), (b)=>semasiz(b,{thinkingBudget:128}), (b)=>temiz(b), (b)=>b ];
  return [ (b)=>temiz(b), (b)=>b ];
}
const CFG_OK = {};   // model -> çalıştığı bilinen varyant

// ---------- Zaman aşımlı istek (sonsuz bekleme yok) ----------
const ZAMAN_ASIMI = 150000;   // 150 sn
function fetchZamanAsimli(u, init){
  const ac = new AbortController();
  const t = setTimeout(()=>ac.abort(), ZAMAN_ASIMI);
  return ORIG_FETCH(u, Object.assign({}, init, {signal: ac.signal})).finally(()=>clearTimeout(t));
}

// ---------- Google'ın gerçek hata mesajını oku ----------
async function googleErr(r){
  try{ const d=await r.clone().json(); return (d && d.error && d.error.message) || JSON.stringify(d).slice(0,200); }
  catch(e){ try{ return (await r.clone().text()).slice(0,200); }catch(e2){ return 'HTTP '+r.status; } }
}
// ---------- Türkçe teşhis: sorun anahtarda mı, modelde mi, promptta mı? ----------
function netHatasi(e){
  const m=String((e&&e.message)||e||'');
  if(/TUM_DOLU/i.test(m))
    return 'SORUN: KOTA. Denenen tüm anahtar ve modellerin kotası dolu'+(m.split('·')[1]?' —'+m.split('·')[1]:'')+'. Anahtarların AYNI PROJEDEyse hepsi aynı kotayı paylaşır; ayrı Google Cloud projelerinde anahtar açarsan her biri kendi kotasını alır.';
  if(/SAFETY|blockReason/i.test(m))
    return 'SORUN: PROMPT. İçerik güvenlik filtresine takıldı. Metni yumuşatıp tekrar dene.';
  if(/API key not valid|API_KEY_INVALID|INVALID_ARGUMENT.*key/i.test(m))
    return 'SORUN: ANAHTAR. Anahtar geçersiz. aistudio.google.com/apikey adresinden yeni bir anahtar oluşturup yapıştır.';
  if(/PERMISSION_DENIED|SERVICE_DISABLED|has not been used|is disabled/i.test(m))
    return 'SORUN: ANAHTAR/PROJE. Generative Language API bu projede kapalı ya da anahtarın yetkisi yok. Google AI Studio\'da yeni anahtar oluştur.';
  if(/referer|referrer|API_KEY_HTTP_REFERRER/i.test(m))
    return 'SORUN: ANAHTAR KISITI. Anahtarına web sitesi (HTTP referrer) kısıtı konmuş; dosyayı bilgisayardan açtığın için engelliyor. Anahtar kısıtlamasını "Yok/None" yap.';
  if(/not found|is not supported|Unknown name.*model|models\//i.test(m) && /404|not found|not supported/i.test(m))
    return 'SORUN: MODEL. Bu model adı anahtarınla kullanılamıyor. "Test Et"e bas — çalışan modeli otomatik bulup seçerim.';
  if(/Unknown name|Invalid JSON payload|INVALID_ARGUMENT/i.test(m))
    return 'SORUN: İSTEK BİÇİMİ. Model bu parametreleri kabul etmiyor. Katman otomatik uyarlamayı deniyor; sürerse modeli gemini-2.5-flash yap.';
  if(/50[0234]|UNAVAILABLE|high demand|overloaded|INTERNAL/i.test(m))
    return 'SORUN: GOOGLE TARAFI (503). Model şu an aşırı yoğun. Senin anahtarınla, modelinle ya da yazdığın metinle İLGİSİ YOK — Google\'ın sunucusu geçici olarak dolu. Katman bekleyip tekrar denedi ve sırayla diğer modelleri denedi; hepsi doluysa 2-3 dakika sonra tekrar dene.';
  if(/429|quota|RESOURCE_EXHAUSTED/i.test(m))
    return 'SORUN: KOTA (429). Hız sınırını düşür ya da gemini-2.5-flash-lite dene. Günlük kota Pasifik saatiyle gece yarısı sıfırlanır.';
  if(/aborted|AbortError|zaman aşımı/i.test(m))
    return 'SORUN: SÜRE. Model 150 saniyede yanıt vermedi. Genelde çok uzun materyal istendiğinde olur: istediğin soru/etkinlik sayısını azalt ya da modeli gemini-2.5-flash yap.';
  if(/Failed to fetch|NetworkError|ERR_/i.test(m))
    return 'SORUN: BAĞLANTI. İnternete ulaşılamadı. Reklam engelleyici/VPN/güvenlik duvarı Google\'a erişimi kesiyor olabilir.';
  if(/KESIK_JSON/i.test(m))
    return 'SORUN: ÇIKTI KESİLDİ. Model JSON\'ı tamamlayamadı (istek çok büyük). İstediğin soru/blok sayısını azalt ya da modeli gemini-2.5-flash yap; katman bütçeyi büyütüp tekrar denedi ama yetmedi.';
  if(/BOŞ_YANIT|MAX_TOKENS/i.test(m))
    return 'SORUN: MODEL/ÇIKTI. Model boş ya da kesik yanıt döndü (düşünme modu çıktı bütçesini yiyor). Katman bunu otomatik kapatmayı denedi; sürerse gemini-2.5-flash-lite dene.';
  return m || 'Bilinmeyen hata.';
}

// ---------- Ekrana bildirim ----------
function toast(html, renk){
  let t=document.getElementById('zirve-toast');
  if(!t){
    t=document.createElement('div'); t.id='zirve-toast';
    t.style.cssText='position:fixed;left:50%;transform:translateX(-50%);bottom:86px;z-index:2147483000;max-width:min(560px,92vw);padding:12px 16px;border-radius:14px;font:600 13px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;box-shadow:0 12px 34px rgba(0,0,0,.22);border:2px solid;display:none';
    document.body.appendChild(t);
  }
  t.innerHTML=html; t.style.display='block';
  if(renk==='red'){ t.style.background='#fee2e2'; t.style.borderColor='#fca5a5'; t.style.color='#991b1b'; }
  else if(renk==='green'){ t.style.background='#dcfce7'; t.style.borderColor='#86efac'; t.style.color='#166534'; }
  else { t.style.background='#fffbeb'; t.style.borderColor='#fcd34d'; t.style.color='#92400e'; }
  clearTimeout(toast._t); toast._t=setTimeout(()=>{ t.style.display='none'; }, renk==='red'?14000:9000);
}

// ---------- Anahtar doğrulama + otomatik model bulma ----------
async function listModels(key){
  const r=await ORIG_FETCH(`https://generativelanguage.googleapis.com/v1beta/models?key=${encodeURIComponent(key)}`);
  if(!r.ok) throw new Error(await googleErr(r));
  const d=await r.json();
  return (d.models||[]).filter(m=>(m.supportedGenerationMethods||[]).indexOf('generateContent')!==-1)
                       .map(m=>String(m.name||'').replace('models/',''));
}
function enIyiModel(list){
  const tercih=["gemini-2.5-flash","gemini-2.5-flash-lite","gemini-flash-latest","gemini-flash-lite-latest","gemini-2.5-pro"];
  for(const t of tercih) if(list.indexOf(t)!==-1) return t;
  return list.find(m=>/flash/.test(m)) || list[0] || null;
}

// ============================================================
//  FETCH SARMALAYICI — uygulamanın 15 çağrısı da buradan geçer
// ============================================================
const ORIG_FETCH = window.fetch.bind(window);

function urlBilgi(u){
  const m = /\/v1beta\/models\/([^:?]+)(:generateContent)?/.exec(u);
  return { model: m?m[1]:null, uretim: !!(m&&m[2]) };
}
function urlKur(u, model, key){
  return u.replace(/\/v1beta\/models\/[^:?]+/, '/v1beta/models/'+model)
          .replace(/([?&])key=[^&]*/, '$1key='+encodeURIComponent(key));
}

window.fetch = async function(input, init){
  const u = (typeof input==='string') ? input : (input && input.url) || '';
  // Bizim ilgilendiğimiz istek değilse dokunma
  if(!/generativelanguage\.googleapis\.com/.test(u)) return ORIG_FETCH(input, init);
  if(!RING.keys.length){
    toast('🔑 <b>Önce API anahtarı ekle.</b> Sağ alttaki <b>🔑 API</b> düğmesine bas, anahtarlarını yapıştır ve <b>Test Et</b>e tıkla.','red');
    return ORIG_FETCH(input, init);   // uygulamanın kendi akışı bozulmasın
  }

  const bilgi = urlBilgi(u);
  let model = MODEL || bilgi.model || 'gemini-2.5-flash';
  const denenenModeller = [model];

  // Gövde varyantları yalnızca üretim isteklerinde (POST) anlamlı
  let govdeVar = (init && init.body) ? govdeVaryantlari(model) : [ (b)=>b ];
  let vi = (CFG_OK[model]!==undefined) ? CFG_OK[model] : 0;
  let orjGovde = null;
  if(init && init.body){ try{ orjGovde = JSON.parse(init.body); }catch(e){ orjGovde=null; } }

  const modelDegistir = ()=>{
    const yeni = modelSonraki(model, denenenModeller);
    if(!yeni) return false;
    const eski = model;
    model = yeni; denenenModeller.push(yeni);
    MODEL = yeni; localStorage.setItem(LS.model, yeni);
    if(init && init.body) govdeVar = govdeVaryantlari(model);
    vi = (CFG_OK[model]!==undefined) ? CFG_OK[model] : 0;
    RING.aktif = null;
    panelYenile();
    toast(`⚡ <b>${eski}</b> kotası tüm anahtarlarda doldu → <b>${yeni}</b> modeline geçildi.<br><span style="font-weight:700;font-size:.72rem">Google'da kota her model için ayrı tutulur; taze kotayla devam ediyorsun.</span>`);
    return true;
  };

  let sonHata = null;
  const yogunSayac = {};      // model -> kaç kez 503 aldı
  let bekleme = 900;          // 503 sonrası bekleme (katlanarak artar)
  for(let deneme=0; deneme<40; deneme++){
    const key = ringPick(model);
    if(!key){
      if(modelDegistir()) continue;
      const b = ringBekleme(model);
      const msg = 'TUM_DOLU'+(b?' · en erken '+b+' sonra':'');
      toast('🚫 '+netHatasi(new Error(msg)),'red');
      sonHata = new Error(msg);
      break;
    }
    const yeniUrl = urlKur(u, model, key);
    const yeniInit = Object.assign({}, init);
    if(orjGovde){
      let g = orjGovde;
      try{ g = govdeVar[Math.min(vi,govdeVar.length-1)](orjGovde); }catch(e){ g = orjGovde; }
      yeniInit.body = JSON.stringify(g);
    }

    await rateGate();
    let r;
    try{ r = await fetchZamanAsimli(yeniUrl, yeniInit); }
    catch(e){ rateRelease(); toast('🌐 '+netHatasi(e),'red'); throw e; }
    rateRelease();

    // --- 429: anahtar değiştir, olmazsa model değiştir ---
    if(r.status===429){
      const em = await googleErr(r);
      const eskiNo = ringNo(key);
      const gunluk = ringCool(key, em, model);
      const kalan = ringHazir(model);
      RING.aktif = kalan[0] || null;
      panelYenile();
      if(RING.aktif){
        toast(`🔑 <b>${eskiNo}. anahtarın ${gunluk?'GÜNLÜK':'dakikalık'} kotası doldu</b> → <b>${ringNo(RING.aktif)}. anahtara</b> geçildi.<br><span style="font-weight:700;font-size:.72rem">Hazır anahtar: ${kalan.length}/${RING.keys.length}${gunluk?' · Günlük kota Pasifik gece yarısı sıfırlanır.':''}</span>`);
        continue;
      }
      if(modelDegistir()) continue;
      const b=ringBekleme(model);
      sonHata = new Error('TUM_DOLU'+(b?' · en erken '+b+' sonra':''));
      toast('🚫 '+netHatasi(sonHata),'red');
      break;
    }

    // --- 400: parametre uyumsuzluğu → sonraki gövde varyantı ---
    if(r.status===400 && orjGovde && vi < govdeVar.length-1){ vi++; continue; }

    // --- 503/500/502/504: Google'ın sunucusu yoğun. Anahtarla ilgisi YOK. ---
    if(r.status===503 || r.status===500 || r.status===502 || r.status===504){
      const em = await googleErr(r);
      yogunSayac[model] = (yogunSayac[model]||0)+1;
      if(yogunSayac[model] <= 3){
        const sn = Math.round(bekleme/1000);
        toast(`⏳ <b>Google tarafı yoğun (${r.status})</b> · <b>${model}</b> · ${yogunSayac[model]}/3. deneme, ${sn} sn sonra tekrar...<br><span style="font-weight:700;font-size:.72rem">Bu senin anahtarınla ilgili değil, Google'ın sunucusu geçici olarak dolu. Bekliyorum, sen bir şey yapma.</span>`);
        await new Promise(res=>setTimeout(res, bekleme));
        bekleme = Math.min(9000, Math.round(bekleme*1.8));
        continue;
      }
      if(modelDegistir()){
        bekleme = 900;
        toast(`🔁 <b>${denenenModeller[denenenModeller.length-2]}</b> yoğunluğu geçmedi → <b>${model}</b> modeli deneniyor.`);
        continue;
      }
      sonHata = new Error('HTTP '+r.status+' · '+em);
      toast('⚠️ '+netHatasi(sonHata),'red');
      return r;
    }

    if(!r.ok){
      const em = await googleErr(r);
      sonHata = new Error('HTTP '+r.status+' · '+em);
      toast('⚠️ '+netHatasi(sonHata),'red');
      return r;    // uygulamanın kendi hata akışı çalışsın
    }

    // --- Boş/kesik yanıt: düşünme modu çıktıyı yemiş olabilir ---
    if(orjGovde && bilgi.uretim){
      let d=null; try{ d = await r.clone().json(); }catch(e){}
      const cand = d && d.candidates && d.candidates[0];
      const metin = ((cand && cand.content && cand.content.parts)||[]).map(x=>x.text||'').join('').trim();
      const bitis = cand && cand.finishReason;
      // Çıktı kesildiyse bütçeyi büyüt ve tekrar dene (JSON yarıda kalmasın)
      if(bitis==='MAX_TOKENS' && orjGovde.generationConfig){
        const eskiTok = orjGovde.generationConfig.maxOutputTokens || 8192;
        if(eskiTok < 30000){
          orjGovde.generationConfig.maxOutputTokens = Math.min(32000, Math.round(eskiTok*1.7));
          if(vi < govdeVar.length-1) vi++;
          continue;
        }
      }
      if(!metin){
        const blok = d && d.promptFeedback && d.promptFeedback.blockReason;
        if(!blok && vi < govdeVar.length-1){ vi++; continue; }   // varyant değiştirip tekrar dene
        sonHata = new Error(blok ? ('SAFETY · '+blok) : ('BOŞ_YANIT'+(bitis?' · '+bitis:'')));
        toast('⚠️ '+netHatasi(sonHata),'red');
        return r;
      }
      // JSON istendiyse gerçekten ayrıştırılabiliyor mu? Değilse tekrar dene.
      const jsonIster = orjGovde.generationConfig && orjGovde.generationConfig.responseMimeType==='application/json';
      if(jsonIster){
        let temizMetin = metin.replace(/^```(?:json)?/i,'').replace(/```$/,'').trim();
        let nesne=null; try{ nesne=JSON.parse(temizMetin); }catch(e){ nesne=null; }
        if(nesne===null){
          if(vi < govdeVar.length-1){ vi++; continue; }
          sonHata = new Error('KESIK_JSON');
          toast('⚠️ '+netHatasi(sonHata),'red');
          return r;
        }
        // --- Sertifika, AÇIKÇA istenmedikçe eklenmez ---
        try{
          const istek = JSON.stringify(orjGovde.contents||'');
          const sertifikaIstendi = /sertifika|başarı belgesi|basari belgesi|başarı sertifikası|takdir belgesi/i.test(istek);
          if(!sertifikaIstendi && nesne && Array.isArray(nesne.icerik_bloklari)){
            const once = nesne.icerik_bloklari.length;
            nesne.icerik_bloklari = nesne.icerik_bloklari.filter(b => !b || b.blok_tipi!=='sertifika');
            if(nesne.icerik_bloklari.length !== once && typeof Response!=='undefined'){
              const kopya = JSON.parse(JSON.stringify(d));
              kopya.candidates[0].content.parts = [{text: JSON.stringify(nesne)}];
              CFG_OK[model]=vi;
              return new Response(JSON.stringify(kopya), {status:200, headers:{'Content-Type':'application/json'}});
            }
          }
        }catch(e){}
      }
    }
    CFG_OK[model] = vi;   // çalışan varyantı hatırla
    return r;
  }
  if(sonHata) throw sonHata;
  return ORIG_FETCH(input, init);
};

let ANAHTAR_GOSTER = false;   // anahtarların tamamı görünsün mü
function _sure(ms){
  if(ms<=0) return 'hazır';
  const dk=Math.ceil(ms/60000);
  if(dk<60) return dk+' dk';
  const s=Math.floor(dk/60), k=dk%60;
  return s+' sa'+(k?' '+k+' dk':'');
}
function panelYenile(){

  }
  // her anahtarın bu modeldeki durumu

    const info = RING.cool[coolKey(MODEL,k)];

    let modelSay = '';
    try{ const mm = (KEY_MODELS && KEY_MODELS[k]); if(mm) modelSay = mm+' model'; }catch(e){}
    if(kalanMs>0){ dolu++; if(gunluk) gunlukDolu++; }
    else hazir++;

        : `<span style="background:#22c55e;color:#fff;font-weight:800;font-size:9px;padding:1px 6px;border-radius:999px">HAZIR</span>`;

<span class="zirve-key-text" data-k="${encodeURIComponent(k)}" style="font-family:ui-monospace,monospace;font-weight:600;opacity:.72;font-size:11px;word-break:break-all;cursor:pointer" title="Tıkla: kopyala">${ANAHTAR_GOSTER ? k : (k.slice(0,7)+'…'+k.slice(-4))}</span>

  }).join('');

    el.onclick=()=>{ try{ const val=decodeURIComponent(el.dataset.k);

  });
  if(ozet){

async function testEt(){
  const out=document.getElementById('zirve-test-out');
  const ta=document.getElementById('zirve-keys');
  ringSet(ta.value.split(/[\n,;]+/));
  RING.aktif=null; ringSave();
  if(!RING.keys.length){ out.innerHTML='<b style="color:#991b1b">Anahtar girmedin.</b>'; return; }
  out.innerHTML='⏳ Her anahtar tek tek deneniyor...';
  const satir=[]; const gecerli=[]; let modeller=null;
  for(let i=0;i<RING.keys.length;i++){
    const k=RING.keys[i];
    try{
      const list=await listModels(k);
      gecerli.push(k); if(!modeller) modeller=list;
      KEY_MODELS[k]=list.length;
      satir.push(`<div style="color:#166534;font-weight:700">✅ ${i+1}. anahtar geçerli · ${list.length} model erişilebilir</div>`);
    }catch(e){
      satir.push(`<div style="color:#991b1b;font-weight:700">❌ ${i+1}. anahtar: ${netHatasi(e)}</div>`);
    }
  }
  if(gecerli.length && modeller){
    KULLANILABILIR = modeller.slice();
    try{ localStorage.setItem('zirve_models', JSON.stringify(modeller)); localStorage.setItem('zirve_keymodels', JSON.stringify(KEY_MODELS)); }catch(e){}
    const havuz = modelHavuzu();
    satir.push(`<div style="color:#166534;font-weight:700">🔁 Yedek model zinciri kuruldu (${havuz.length} model): ${havuz.slice(0,4).join(' → ')}${havuz.length>4?' → …':''}</div>`);
    const secili=document.getElementById('zirve-model').value.trim();
    if(!secili || modeller.indexOf(secili)===-1){
      const iyi=enIyiModel(modeller);
      if(iyi){ MODEL=iyi; localStorage.setItem(LS.model,iyi); document.getElementById('zirve-model').value=iyi;
        satir.push(`<div style="color:#1d4ed8;font-weight:800">⚡ Model otomatik seçildi: ${iyi}</div>`); }
    } else { MODEL=secili; localStorage.setItem(LS.model,secili); }
    const dl=document.getElementById('zirve-model-list');
    if(dl) dl.innerHTML = modeller.map(m=>`<option value="${m}">`).join('');
    if(gecerli.length>=2){
      satir.push(`<div style="color:#92400e;font-weight:700;margin-top:4px">ℹ️ Not: Google'da kota <b>anahtar başına değil, PROJE başına</b>dır. Anahtarların aynı projedeyse aynı kotayı paylaşır; ayrı projelerde açarsan her biri kendi kotasını alır.</div>`);
    }
  }
  out.innerHTML = satir.join('');
  ringSave(); panelYenile();
  if(gecerli.length){
    toast(`✅ <b>${gecerli.length}/${RING.keys.length} anahtar çalışıyor · model: ${MODEL}</b><br><span style="font-weight:700;font-size:.72rem">Sayfa yenileniyor, ardından tüm AI özellikleri açık olacak.</span>`,'green');
    setTimeout(()=>location.reload(), 2200);
  }
}

        const callGoogle = async (apiKey, modelName, prompt, type = 'json') => {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`;
            
            // API Body hazırlığı
            const requestBody = {
                contents: [{ parts: [{ text: prompt }] }]
            };

            // SORU ÜRETME PROBLEMİNİ ÇÖZEN KRİTİK KISIM
            if (type === 'json') {
                requestBody.generationConfig = {
                    responseMimeType: "application/json"
                };
            }

            try {
                const response = await fetch(url, { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify(requestBody) 
                });
                
                const data = await response.json();
                if (data.error) throw new Error(data.error.message);
                
                let text = data.candidates?.[0]?.content?.parts?.[0]?.text;
                if (!text) throw new Error("Cevap boş.");
                
                if (type === 'html') return text;
                
                // JSON Temizleme (Her ihtimale karşı temizlik yapıyoruz, ama generationConfig çoğu işi çözer)
                text = text.replace(/```json/g, '').replace(/```/g, '').trim();
                const s = text.indexOf('['); const e = text.lastIndexOf(']');
                if (s !== -1 && e !== -1) text = text.substring(s, e+1);
                
                return JSON.parse(text);
            } catch (e) { 
                console.error(e); 
                throw e; 
            }
        };

                    <button onClick={goBack} className="absolute top-4 left-4 md:top-8 md:left-8 bg-white p-4 rounded-full shadow-lg text-slate-600 hover:text-indigo-600 transition z-10"><Icon name="arrow-left" size={24}/></button>
                    <div className="bg-white p-8 md:p-12 rounded-[3rem] shadow-2xl max-w-3xl mx-auto w-full border-4 border-indigo-50 relative overflow-hidden">
                        <div className="absolute top-0 right-0 bg-indigo-600 text-white font-black text-xs px-6 py-2 rounded-bl-3xl tracking-widest shadow-md">DENEME MERKEZİ V50</div>
                        <div className="text-center mb-10 mt-4"><h2 className="text-4xl font-black text-slate-800 tracking-tight">Yapay Zeka Sınav Koçu</h2><p className="text-slate-500 font-bold mt-3 text-lg">Denemeni hedefine göre şekillendir.</p></div>
                        
                        <div className="space-y-8">
                            <div className="bg-slate-50 p-6 rounded-[2rem] border-2 border-slate-100 shadow-sm">
                                <label className="flex items-center text-sm font-black text-indigo-600 uppercase tracking-widest mb-4"><Icon name="target" size={18} className="mr-2"/> Hedef Alan (AGS / ÖABT)</label>
                                <select value={config.type} onChange={e=>setConfig({...config, type: e.target.value})} className="w-full p-4 bg-white border-2 border-slate-200 rounded-2xl font-bold text-slate-700 text-lg outline-none focus:border-indigo-500 cursor-pointer shadow-sm">
                                    {categories.map(c => <option key={c} value={c}>{c}</option>)}
                                </select>
                            </div>

                            <div className="bg-slate-50 p-6 rounded-[2rem] border-2 border-slate-100 shadow-sm">
                                <label className="flex items-center text-sm font-black text-purple-600 uppercase tracking-widest mb-4"><Icon name="brain-circuit" size={18} className="mr-2"/> Zorluk & Soru Stratejisi</label>
                                <select value={config.strategy} onChange={e=>setConfig({...config, strategy: e.target.value})} className="w-full p-4 bg-white border-2 border-slate-200 rounded-2xl font-bold text-slate-700 text-lg outline-none focus:border-purple-500 cursor-pointer shadow-sm">
                                    {strategies.map(s => <option key={s} value={s}>{s}</option>)}
                                </select>
                            </div>

                            <div className="bg-slate-50 p-6 rounded-[2rem] border-2 border-slate-100 shadow-sm">
                                <label className="flex items-center text-sm font-black text-rose-600 uppercase tracking-widest mb-4"><Icon name="list-ordered" size={18} className="mr-2"/> Soru Sayısı</label>
                                <div className="flex items-center gap-6">
                                    <input type="range" min="5" max="50" step="5" value={config.count} onChange={e=>setConfig({...config, count: parseInt(e.target.value)})} className="flex-1 h-3 bg-slate-200 rounded-lg appearance-none cursor-pointer accent-rose-500" />
                                    <div className="bg-white border-4 border-rose-100 w-24 h-16 flex items-center justify-center rounded-2xl font-black text-3xl text-rose-600 shadow-sm">{config.count}</div>
                                </div>
                            </div>
                        </div>

                        <button onClick={()=>startTrial(config)} className="mt-10 w-full bg-slate-800 text-white py-6 rounded-[2rem] font-black text-2xl shadow-2xl hover:bg-black transition active:scale-95 flex items-center justify-center gap-3 border-4 border-slate-700">
                            <Icon name="play" size={28}/> SİMÜLASYONU BAŞLAT
                        </button>
                    </div>
                </div>
            );
        };

       const Quiz = ({ questions, goBack, addToErrors, isNotebook }) => {
            const [idx, setIdx] = useState(0);
            const [show, setShow] = useState(false);
            const [score, setScore] = useState(0);
            const q = questions[idx];
            
            const handleAns = (i) => { 
                if(show) return; 
                setShow(true); 
                if(i===q.ans) {
                    setScore(score+1); 
                } else {
                    addToErrors({q:q.q, w:q.opts[i], r:q.opts[q.ans], e:q.exp, t: isNotebook?"Defter":"Deneme"}); 
                }
            };
            
            return (
                <div className="h-full flex flex-col bg-slate-100 p-4 md:p-8 anim-fade">
                    <div className="flex justify-between items-center mb-6 max-w-7xl mx-auto w-full">
                        <button onClick={goBack} className="bg-white px-6 py-3 rounded-2xl font-black text-slate-600 hover:text-red-600 shadow-md transition">Sınavı Bitir</button>
                        <div className="bg-indigo-600 px-6 py-3 rounded-2xl font-black text-white shadow-md text-lg tracking-widest">SORU {idx+1} / {questions.length}</div>
                    </div>
                    <div className="flex-1 overflow-y-auto max-w-7xl mx-auto w-full hide-scroll pb-10">
                        
                        <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
                            {/* SOL PANEL: DENEME SORUSU */}
                            <div className="lg:col-span-7 space-y-6">
                                <div className="bg-white p-8 md:p-10 rounded-[3rem] shadow-xl border-2 border-slate-100 relative">
                                    <div className="absolute top-0 left-8 w-16 h-8 bg-indigo-100 rounded-b-xl flex items-center justify-center"><Icon name="help-circle" className="text-indigo-500"/></div>
                                    <p className="font-bold text-xl text-slate-800 leading-relaxed mt-4 whitespace-pre-wrap">{q.q}</p>
                                </div>
                                
                                <div className="space-y-3">
                                    {q.opts.map((o,i)=>
                                        <button key={i} onClick={()=>handleAns(i)} disabled={show} className={`w-full text-left p-5 rounded-[2rem] border-4 font-bold text-lg transition-all shadow-sm ${show?(i===q.ans?'border-emerald-500 bg-emerald-50 text-emerald-800':i!==q.ans&&'opacity-40 bg-white border-slate-100 text-slate-400'):'border-white bg-white text-slate-700 hover:border-indigo-300 hover:shadow-md'}`}>
                                            <span className={`inline-flex items-center justify-center w-8 h-8 rounded-full mr-4 text-sm ${show&&i===q.ans?'bg-emerald-500 text-white':'bg-slate-100 text-slate-500'}`}>{String.fromCharCode(65+i)}</span>
                                            {o}
                                        </button>
                                    )}
                                </div>

                                {show && 
                                    <div className="mt-8 p-8 bg-indigo-50 border-4 border-indigo-200 rounded-[3rem] text-slate-800 shadow-xl anim-fade relative overflow-hidden">
                                        <div className="absolute top-0 right-0 bg-indigo-200 text-indigo-800 font-black text-[10px] px-4 py-2 rounded-bl-2xl uppercase tracking-widest"><Icon name="brain" size={14} className="inline mb-0.5 mr-1"/> Çözüm</div>
                                        <div className="readable-text text-base mt-2" dangerouslySetInnerHTML={{__html: q.exp}}></div>
                                    </div>
                                }
                            </div>

                            {/* SAĞ PANEL: ÖSYM SİMÜLASYONU VE TUZAK ANALİZİ */}
                            <div className="lg:col-span-5">
                                <div className="bg-amber-50 border-4 border-amber-200 p-8 rounded-[3rem] shadow-xl relative sticky top-0">
                                    <div className="absolute top-0 right-8 bg-amber-500 text-white font-black text-xs px-4 py-2 rounded-b-xl uppercase tracking-widest shadow-md">ÖSYM NE SORMUŞTU?</div>
                                    
                                    <h3 className="text-xl font-black text-amber-900 mt-6 mb-4 flex items-center"><Icon name="history" className="mr-2 text-amber-600"/> Çıkmış Soru Simülasyonu</h3>
                                    <p className="text-amber-800 font-semibold leading-relaxed mb-6 whitespace-pre-wrap">{q.osym_q || "Bu konudan çıkmış benzer bir soru simülasyonu yükleniyor..."}</p>
                                    
                                    <div className="bg-white p-6 rounded-3xl border-2 border-amber-100 shadow-sm">
                                        <h4 className="text-sm font-black text-rose-600 uppercase tracking-widest mb-3 flex items-center"><Icon name="alert-triangle" size={16} className="mr-2"/> ÖSYM Tuzağı</h4>
                                        <p className="text-slate-700 font-medium text-sm leading-relaxed">{q.osym_analizi || "ÖSYM'nin bu formattaki klasik tuzak ve çeldiricilerine dikkat edin."}</p>
                                    </div>
                                </div>
                            </div>
                        </div>

                    </div>
                    {show && 
                        <div className="max-w-7xl mx-auto w-full pt-4">
                            <button onClick={()=>{if(idx<questions.length-1){setIdx(idx+1);setShow(false)}else{alert(`Sınav Bitti! Puanın: ${score}/${questions.length}`);goBack()}}} className="w-full bg-slate-800 text-white py-6 rounded-[2rem] font-black text-2xl shadow-2xl hover:bg-black transition active:scale-95 flex justify-center items-center gap-3 border-4 border-slate-700">
                                {idx<questions.length-1 ? 'SIRADAKİ SORU' : 'SONUÇLARI GÖR'} <Icon name="arrow-right" size={28}/>
                            </button>
                        </div>
                    }
                </div>
            );
        };

        const Flashcards = ({ cards, goBack }) => {
            const [idx, setIdx] = useState(0);
            const [flipped, setFlipped] = useState(false);
            return (
                <div className="h-full flex flex-col bg-slate-100 p-6 anim-fade">
                    <div className="flex justify-between items-center mb-8 max-w-md mx-auto w-full">
                        <button onClick={goBack} className="p-4 bg-white rounded-full shadow-md text-slate-600 hover:text-indigo-600 transition"><Icon name="x" size={24}/></button>
                        <span className="font-black text-indigo-600 bg-white px-6 py-3 rounded-full shadow-md text-lg">{idx+1} / {cards.length}</span>
                    </div>
                    <div className="flex-1 w-full max-w-md mx-auto perspective-1000 mb-8" onClick={()=>setFlipped(!flipped)}>
                        <div className={`relative w-full h-full transition-transform duration-700 transform-style-3d cursor-pointer ${flipped?'rotate-y-180':''}`}>
                            <div className="absolute w-full h-full backface-hidden bg-white rounded-[3rem] shadow-2xl flex flex-col items-center justify-center p-10 border-b-8 border-indigo-500">
                                <span className="text-sm font-black text-slate-300 uppercase tracking-widest mb-8"><Icon name="eye" className="inline mb-1 mr-1"/> Ön Yüz (Soru)</span>
                                <div className="text-3xl font-bold text-center text-slate-800 leading-snug">{cards[idx].front}</div>
                                <div className="absolute bottom-8 text-slate-300 text-xs font-bold animate-pulse">Çevirmek İçin Dokun</div>
                            </div>
                            <div className="absolute w-full h-full backface-hidden rotate-y-180 bg-gradient-to-br from-indigo-600 to-purple-700 text-white rounded-[3rem] shadow-2xl flex flex-col items-center justify-center p-10 border-b-8 border-indigo-900">
                                <span className="text-sm font-black text-indigo-300 uppercase tracking-widest mb-8"><Icon name="check-circle" className="inline mb-1 mr-1"/> Arka Yüz (Cevap)</span>
                                <div className="text-2xl font-medium text-center leading-relaxed">{cards[idx].back}</div>
                            </div>
                        </div>
                    </div>
                    <div className="flex gap-4 max-w-md mx-auto w-full">
                        <button onClick={()=>{setIdx(Math.max(0,idx-1));setFlipped(false)}} disabled={idx===0} className="flex-1 bg-white py-5 rounded-2xl font-black text-slate-600 shadow-md hover:bg-slate-50 disabled:opacity-50"><Icon name="arrow-left" className="inline mr-2"/> Geri</button>
                        <button onClick={()=>{setIdx(Math.min(cards.length-1,idx+1));setFlipped(false)}} disabled={idx===cards.length-1} className="flex-1 bg-slate-800 text-white py-5 rounded-2xl font-black shadow-md hover:bg-black disabled:opacity-50">İleri <Icon name="arrow-right" className="inline ml-2"/></button>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [view, setView] = useState('dashboard');
            const [apiKey, setApiKey] = useState(localStorage.getItem('baris_key') || "");
            const [modelName, setModelName] = useState(localStorage.getItem('baris_model') || "gemini-2.5-flash");
            const [loading, setLoading] = useState(false);
            const [modalData, setModalData] = useState(null); 
            const [quizData, setQuizData] = useState([]);
            const [cardData, setCardData] = useState([]);
            const [errors, setErrors] = useState(JSON.parse(localStorage.getItem('baris_errors')||'[]'));
            const [stats, setStats] = useState(JSON.parse(localStorage.getItem('baris_stats')||'{}'));
            const [lastStudied, setLastStudied] = useState(JSON.parse(localStorage.getItem('baris_last_study')||'{}'));
            const [activeTopic, setActiveTopic] = useState("Genel");

            const daysLeft = Math.ceil((new Date('2026-07-12') - new Date()) / (1000 * 60 * 60 * 24));
            
            useEffect(()=>{
                localStorage.setItem('baris_errors', JSON.stringify(errors));
                localStorage.setItem('baris_stats', JSON.stringify(stats));
                localStorage.setItem('baris_last_study', JSON.stringify(lastStudied));
            },[errors, stats, lastStudied]);

            const trackError = (topic) => {
                const newStats = {...stats};
                const key = topic.split('.')[0].trim();
                newStats[key] = (newStats[key] || 0) + 1;
                setStats(newStats);
            };

            const recordStudy = (topic) => {
                const newLast = {...lastStudied};
                newLast[topic] = new Date().toISOString();
                setLastStudied(newLast);
            };

            const handleAction = async (type, topic) => {
                if(!apiKey) return alert("Hocam önce ayarlardan API anahtarını bağlayalım!");
                setLoading(true);
                setActiveTopic(topic);
                recordStudy(topic);
                try {
                    let prompt = "";
                    const renkliKural = "HTML etiketleri kullan. <strong> (önemli yerler için), <em> (uyarılar için) etiketlerini bolca kullanarak metni rengarenk, vurgulu ve görsel olarak akılda kalıcı yap. Maddeleri <ul> ve <li> ile yaz.";
                    
                    if(type==='hap') prompt = `Konu: '${topic}'. KPSS/ÖABT için ÖSYM'nin en çok sorduğu, çeldiricisi en yüksek 5 kritik 'Atama Getiren' bilgi. ${renkliKural}`;
                    if(type==='ozet') prompt = `Konu: '${topic}'. Okul Öncesi ÖABT derinliğinde detaylı özet. Sıkıcı düz metinler yazma. ${renkliKural} Ana başlıkları <h3> yap.`;
                    if(type==='card') prompt = `Konu: '${topic}'. Bu konuda en çok karıştırılan kavram çiftleri. JSON Array: [{"front":"...", "back":"..."}]`;
                    if(type==='test') prompt = `Konu: '${topic}'. Tam ÖSYM standardında, öncüllü (I, II, III) ve zor 5 soru. SADECE JSON: [{"q":"...","opts":["..."],"ans":0,"exp":"..."}]`;
                    if(type==='duel') prompt = `Konu: '${topic}'. Bu kavramın 'en çok karıştırıldığı' rakip kavramı bul. İkisi arasındaki hayati farkları, ÖSYM'nin tuzaklarını <table>, <tr>, <th>, <td> etiketleri ile çok şık bir tablo olarak çiz. ${renkliKural}`;
                    if(type==='hafiza') prompt = `Konu: '${topic}'. Bu konuyu ezberlemek için KPSS/ÖABT öğrencilerinin kullandığı absürt, komik, akılda kalıcı akrostişler, şifreler veya 'Hafıza Çivileri' üret. ${renkliKural}`;
                    if(type==='ags_logic') prompt = `Barış Hocam için AGS tarzı bir 'Sözel Mantık' kurgusu hazırla. Hikaye, öncüller ve 4 adet soru olsun. Çözümde tabloyu nasıl kurması gerektiğini de anlat. ${renkliKural}`;

                    const res = await callGoogle(apiKey, modelName, prompt, (type==='card'||type==='test')?'json':'html');
                    
                    if(type==='hap'||type==='ozet'||type==='duel'||type==='ags_logic'||type==='hafiza') setModalData({type:'info', title: type==='hafiza' ? '🧠 Hafıza Çivisi: ' + topic : topic === 'AGS Sözel Mantık' ? 'AGS Mantık Atölyesi' : topic, content:res});
                    else if(type==='card') { setCardData(res); setView('flashcards'); }
                    else { setQuizData(res); setView('quiz'); }
                } catch(e) { alert("Yapay zeka yoruldu hocam, bir daha deneyelim!"); console.error(e); } finally { setLoading(false); }
            };

            const startTrial = async (conf) => {
                if(!apiKey) return alert("Anahtar giriniz!"); 
                if(!modelName) return alert("Model adı giriniz!");
                setLoading(true);
                setActiveTopic(conf.type);
                try {
                    const prompt = `Sen ordinaryüs profesör seviyesinde bir KPSS/ÖABT ve AGS uzmanısın. Alan: "${conf.type}". Seçilen stratejiye uygun "${conf.strategy}" zorluğunda ${conf.count} adet deneme sorusu yaz. 
                    MUAZZAM KURAL: Hazırladığın her deneme sorusu için bir de o konuya benzeyen 'Sınavda Çıkmış Soru Simülasyonu' (osym_q) ve ÖSYM'nin o konuda adayları nasıl elediğini anlatan 'ÖSYM Tuzağı Analizi' (osym_analizi) üreteceksin! 
                    SADECE JSON GÖNDER. Format: [{"q":"Ana Soru","opts":["A","B","C","D","E"],"ans":0,"exp":"HTML <strong>, <em>, <ul> ve emojiler kullanarak detaylıca açıkla.","osym_q":"Bu konuya benzer çıkmış veya çıkabilecek ÖSYM tarzı soru simülasyonu...","osym_analizi":"ÖSYM bu konuda öğrencileri hangi kelime oyunlarıyla veya mantıkla düşürür?"}]`;
                    const res = await callGoogle(apiKey, modelName, prompt, 'json');
                    setQuizData(res); setView('quiz');
                } catch(e) { alert("Hata oluştu."); } finally { setLoading(false); }
            };

            return (
                <div className="h-screen bg-slate-50 text-slate-800 font-sans select-none">
                    {loading && <div className="fixed inset-0 z-[100] bg-white/95 flex flex-col items-center justify-center"><div className="loader mb-6"></div><p className="font-black text-indigo-600 tracking-widest uppercase animate-pulse text-xl">Yapay Zeka Çalışıyor...</p></div>}
                    
                    {modalData?.type === 'info' && <InfoModal data={modalData} close={()=>setModalData(null)}/>}

                    {view === 'dashboard' && <Dashboard apiKey={apiKey} setApiKey={setApiKey} modelName={modelName} setModelName={setModelName} changeView={setView} daysLeft={daysLeft} stats={stats} handleAction={handleAction}/>}
                    {view === 'syllabus' && <Syllabus apiKey={apiKey} modelName={modelName} goBack={()=>setView('dashboard')} onAction={handleAction}/>}
                    {view === 'trial_setup' && <TrialSetup goBack={()=>setView('dashboard')} startTrial={startTrial}/>}
                    {view === 'quiz' && <Quiz questions={quizData} goBack={()=>setView('dashboard')} addToErrors={err=>{setErrors([err,...errors]); trackError(activeTopic);}} isNotebook={false}/>}
                    {view === 'flashcards' && <Flashcards cards={cardData} goBack={()=>setView('syllabus')}/>}
                    
                    {view === 'errors' && 
                        <div className="h-full p-4 md:p-8 flex flex-col max-w-5xl mx-auto anim-fade">
                            <div className="flex justify-between items-center mb-8">
                                <button onClick={()=>setView('dashboard')} className="p-4 bg-white rounded-full shadow-md text-slate-600 hover:text-indigo-600 transition"><Icon name="arrow-left"/></button>
                                <h2 className="font-black text-3xl md:text-4xl text-slate-800 tracking-wider flex items-center"><Icon name="flame" size={36} className="text-red-500 mr-3"/> HATA DEFTERİM</h2>
                                <button onClick={()=>setErrors([])} className="bg-red-100 text-red-600 px-6 py-3 rounded-2xl font-black hover:bg-red-200 transition shadow-sm">Temizle</button>
                            </div>
                            <div className="flex-1 overflow-y-auto space-y-6 hide-scroll pb-10">
                                {errors.length === 0 ? 
                                    <div className="text-center text-slate-400 font-bold mt-20 flex flex-col items-center"><Icon name="check-circle" size={64} className="mb-4 opacity-50"/>Henüz kaydedilmiş bir hatan yok. Harika gidiyorsun!</div> : 
                                    errors.map((e,i)=>
                                        <div key={i} className="bg-white p-6 md:p-10 rounded-[3rem] border-4 border-slate-100 shadow-xl relative overflow-hidden">
                                            <div className="absolute top-0 left-10 w-12 h-16 bg-red-500 rounded-b-2xl flex items-end justify-center pb-2 text-white font-black">{i+1}</div>
                                            <div className="font-black text-xl text-slate-800 mb-6 mt-4">{e.q}</div>
                                            <div className="flex flex-col md:flex-row gap-4 mb-8">
                                                <div className="flex-1 bg-red-50 p-5 rounded-2xl border-2 border-red-100">
                                                    <div className="text-xs font-black text-red-400 uppercase tracking-widest mb-2 flex items-center"><Icon name="x-circle" size={14} className="mr-1"/> Senin Cevabın</div>
                                                    <div className="font-bold text-red-700 text-lg leading-tight">{e.w}</div>
                                                </div>
                                                <div className="flex-1 bg-emerald-50 p-5 rounded-2xl border-2 border-emerald-100">
                                                    <div className="text-xs font-black text-emerald-500 uppercase tracking-widest mb-2 flex items-center"><Icon name="check-circle" size={14} className="mr-1"/> Doğru Cevap</div>
                                                    <div className="font-bold text-emerald-700 text-lg leading-tight">{e.r}</div>
                                                </div>
                                            </div>
                                            <div className="bg-indigo-50 p-6 md:p-8 rounded-[2rem] border-2 border-indigo-100 relative">
                                                <div className="absolute -top-4 right-8 bg-indigo-500 text-white font-black text-[10px] px-4 py-2 rounded-full uppercase tracking-widest shadow-md">Zihin Haritası</div>
                                                <div className="text-indigo-900 text-base leading-relaxed readable-text" dangerouslySetInnerHTML={{__html: e.e}}></div>
                                            </div>
                                        </div>
                                    )
                                }
                            </div>
                        </div>
                    }
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
