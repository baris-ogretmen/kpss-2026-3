    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #f8fafc; color: #1e293b; margin: 0; overflow: hidden; }
        .brand { font-family: 'Fredoka', sans-serif; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .loader { border: 4px solid #e2e8f0; border-top: 4px solid #6366f1; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .anim-fade { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        
        /* Renkli vurgular */
        .readable-text strong { color: #4f46e5; font-weight: 800; }
        .readable-text em { background-color: #fef08a; color: #854d0e; font-style: normal; padding: 0 4px; border-radius: 4px; font-weight: 600; }
        .readable-text ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 1rem; }
        .readable-text h3 { color: #1e293b; font-size: 1.25rem; font-weight: 800; margin-top: 1.5rem; margin-bottom: 0.5rem; border-bottom: 2px solid #e2e8f0; padding-bottom: 0.25rem; }
        
        /* Kart Stili */
        .perspective-1000 { perspective: 1000px; }
        .transform-style-3d { transform-style: preserve-3d; }
        .backface-hidden { backface-visibility: hidden; }
        .rotate-y-180 { transform: rotateY(180deg); }
    </style>
</head>

                    },

        const INSTRUCTORS = {
            'Tarih': ['Ramazan Yetgin', 'Aydın Yüce', 'Mehmet Celal Özyıldız'],
            'Coğrafya': ['Bayram Meral', 'Engin Eraydın'],
            'Vatandaşlık': ['Emrah Vahap Özkaraca'],
            'Matematik': ['İlyas Güneş'],
            'Eğitim': ['Metin Şar', 'Bülent Tanık', 'Cüneyt İltuş', 'Fatih Genç'],
            'ÖABT': ['Hilal Hoca', 'Okul Öncesi ÖABT TV', 'Sultan Hoca', 'Murat Sakin']
        };

        const Icon = ({ name, size=20, className="" }) => {
            useEffect(() => { if(window.lucide) window.lucide.createIcons(); });
            return <i data-lucide={name} className={className} style={{ width: size, height: size }}></i>;
        };

        const callGoogle = async (apiKey, modelName, prompt, type = 'json') => {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/${modelName}:generateContent?key=${apiKey}`;
            
            // API Body hazırlığı
            const requestBody = {
                contents: [{ parts: [{ text: prompt }] }]
            };

            // SORU ÜRETME PROBLEMİNİ ÇÖZEN KRİTİK KISIM
            if (type === 'json') {
                requestBody.generationConfig = {
                    responseMimeType: "application/json"
                };
            }

            try {
                const response = await fetch(url, { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' }, 
                    body: JSON.stringify(requestBody) 
                });
                
                const data = await response.json();
                if (data.error) throw new Error(data.error.message);
                
                let text = data.candidates?.[0]?.content?.parts?.[0]?.text;
                if (!text) throw new Error("Cevap boş.");
                
                if (type === 'html') return text;
                
                // JSON Temizleme (Her ihtimale karşı temizlik yapıyoruz, ama generationConfig çoğu işi çözer)
                text = text.replace(/```json/g, '').replace(/```/g, '').trim();
                const s = text.indexOf('['); const e = text.lastIndexOf(']');
                if (s !== -1 && e !== -1) text = text.substring(s, e+1);
                
                return JSON.parse(text);
            } catch (e) { 
                console.error(e); 
                throw e; 
            }
        };

        // --- COMPONENTS ---

     const Dashboard = ({ apiKey, setApiKey, modelName, setModelName, changeView, daysLeft, openNotebook }) => {
            const [keyInput, setKeyInput] = useState(apiKey || "");
            const [modelInput, setModelInput] = useState(modelName || "gemini-2.5-flash-preview-09-2025");
            const [keyStatus, setKeyStatus] = useState(apiKey ? 'valid' : 'idle'); 

            const saveKey = async () => { 
                if(!keyInput.trim()) return alert("Lütfen anahtarı kutuya yapıştır!");
                if(!modelInput.trim()) return alert("Lütfen geçerli bir model adı gir!");
                
                setKeyStatus('checking');
                try {
                    await callGoogle(keyInput.trim(), modelInput.trim(), "Merhaba", "html");
                    localStorage.setItem("baris_key", keyInput.trim()); 
                    localStorage.setItem("baris_model", modelInput.trim()); 
                    setApiKey(keyInput.trim()); 
                    setModelName(modelInput.trim());
                    setKeyStatus('valid');
                } catch (error) {
                    setKeyStatus('invalid');
                    alert("Bu anahtar veya model çalışmıyor! ❌");
                }
            };

            const getBorderColor = () => {
                if(keyStatus === 'valid') return 'border-emerald-500 bg-emerald-50';
                if(keyStatus === 'invalid') return 'border-red-500 bg-red-50';
                if(keyStatus === 'checking') return 'border-yellow-500 bg-yellow-50';
                return 'border-indigo-200 bg-white';
            };

            return (
                <div className="h-full overflow-y-auto p-4 md:p-8 flex flex-col items-center max-w-4xl mx-auto anim-fade">
                    
                    {/* ULTRA KOMPAKT ÜST BAR (SAYAÇ VE AYARLAR BİR ARADA) */}
                    <div className="w-full flex flex-col md:flex-row items-center justify-between bg-white rounded-[2rem] p-4 shadow-xl border-4 border-slate-50 mb-10 gap-4">
                        <div className="flex items-center gap-4 w-full md:w-auto">
                            <div className="bg-gradient-to-br from-rose-500 to-red-600 text-white px-6 py-3 rounded-2xl flex flex-col items-center justify-center shadow-md">

                                <span className="text-2xl font-black brand leading-none">{daysLeft} Gün</span>
                            </div>
                            <div>
                                <h1 className="text-2xl font-black text-slate-800 brand leading-none">DENEME ÜSSÜ</h1>
                                <div className="text-indigo-600 font-bold text-xs tracking-widest uppercase">Barış Akademi 2026</div>
                            </div>
                        </div>

                        <div className={`flex items-center gap-2 bg-slate-50 p-2 rounded-2xl border-2 transition w-full md:w-auto ${getBorderColor()}`}>
                            <Icon name="cpu" size={18} className="text-slate-400 hidden md:block ml-2"/>
                            <input value={keyInput} onChange={e=>{setKeyInput(e.target.value); setKeyStatus('idle');}} type="password" placeholder="API Anahtarı" className="w-full md:w-28 bg-transparent text-sm font-mono outline-none border-r border-slate-300 p-1"/>
                            <input value={modelInput} onChange={e=>setModelInput(e.target.value)} className="w-full md:w-36 bg-transparent text-sm font-bold text-slate-600 outline-none p-1" placeholder="Model Adı"/>
                            <button onClick={saveKey} className={`px-4 py-2 rounded-xl text-sm font-black text-white shadow-md transition ${keyStatus==='valid'?'bg-emerald-500':'bg-indigo-600 hover:bg-indigo-700'}`}>
                                {keyStatus==='checking' ? '...' : keyStatus==='valid' ? '✅' : 'BAĞLAN'}
                            </button>
                        </div>
                    </div>

                    {/* ANA BUTONLAR (Ekrana Tam Hakimiyet) */}
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6 w-full">
                        <button onClick={()=>changeView('trial_setup')} className="bg-indigo-600 p-10 rounded-[2.5rem] shadow-2xl hover:bg-indigo-700 hover:-translate-y-1 transition-all group flex flex-col items-center gap-4 relative overflow-hidden">
                            <div className="absolute inset-0 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')] opacity-10"></div>
                            <div className="bg-white/20 text-white p-6 rounded-full group-hover:scale-110 transition z-10"><Icon name="rocket" size={56}/></div>
                            <span className="font-black text-white text-3xl tracking-widest z-10">DENEME BAŞLAT</span>
                            <span className="text-indigo-200 font-bold z-10">Özel Yapay Zeka Modu</span>
                        </button>
                        <button onClick={()=>changeView('errors')} className="bg-white p-10 rounded-[2.5rem] shadow-xl border-4 border-slate-100 hover:border-red-500 hover:-translate-y-1 transition-all group flex flex-col items-center gap-4">
                            <div className="bg-red-100 text-red-600 p-6 rounded-full group-hover:scale-110 transition"><Icon name="flame" size={56}/></div>

                            <span className="text-slate-500 font-bold">Zihin Haritalı Çözümler</span>

        };
const TrialSetup = ({ goBack, startTrial }) => {
            const [config, setConfig] = useState({ type: 'Okul Öncesi ÖABT Tüm Konular', count: 15, strategy: 'ÖSYM Standart Zorluk' });
            
            const categories = [
                "Okul Öncesi ÖABT Tüm Konular", "Okul Öncesi Eğitime Giriş & Yaklaşımlar", "Çocuk Psikolojisi ve Gelişimi", 
                "Anne-Çocuk Sağlığı ve İlkyardım", "Çocuk Edebiyatı ve Oyun Gelişimi", "AGS - Genel Yetenek Genel Kültür", "Eğitim Bilimleri ve Mevzuat (ÖMK)"

            const strategies = ["ÖSYM Standart Zorluk", "Ters Köşe (Çeldiricisi Yüksek)", "Kavram Karşılaştırmalı (Zor)"];

            return (
                <div className="h-full flex flex-col justify-center p-4 md:p-8 bg-slate-100 anim-fade">

                    <div className="bg-white p-8 md:p-12 rounded-[3rem] shadow-2xl max-w-2xl mx-auto w-full border-4 border-indigo-50 relative overflow-hidden">
                        <div className="absolute top-0 right-0 bg-amber-400 text-amber-900 font-black text-xs px-4 py-2 rounded-bl-2xl">TÜRKİYE'DE İLK! 🚀</div>
                        <div className="text-center mb-8"><h2 className="text-4xl font-black text-slate-800">Yapay Zeka Sınav Koçu</h2><p className="text-slate-500 font-bold mt-2">Denemeni dilediğin gibi özelleştir.</p></div>
                        
                        <div className="mb-6">
                            <label className="block text-sm font-black text-indigo-600 uppercase tracking-widest mb-2">Hedef Alan</label>
                            <select value={config.type} onChange={e=>setConfig({...config, type: e.target.value})} className="w-full p-4 bg-slate-50 border-2 border-slate-200 rounded-2xl font-bold text-slate-700 text-lg outline-none focus:border-indigo-500 cursor-pointer shadow-inner">
                                {categories.map(c => <option key={c} value={c}>{c}</option>)}

                        </div>

                        <div className="mb-6">
                            <label className="block text-sm font-black text-indigo-600 uppercase tracking-widest mb-2">Zorluk Stratejisi</label>
                            <select value={config.strategy} onChange={e=>setConfig({...config, strategy: e.target.value})} className="w-full p-4 bg-slate-50 border-2 border-slate-200 rounded-2xl font-bold text-slate-700 text-lg outline-none focus:border-indigo-500 cursor-pointer shadow-inner">
                                {strategies.map(s => <option key={s} value={s}>{s}</option>)}
                            </select>
                        </div>

                        <div className="mb-10">
                            <label className="block text-sm font-black text-indigo-600 uppercase tracking-widest mb-2">Kaç Soru Çözeceksin?</label>
                            <div className="flex items-center gap-4 bg-slate-50 p-2 rounded-2xl border-2 border-slate-200 shadow-inner">
                                <input type="range" min="1" max="100" value={config.count} onChange={e=>setConfig({...config, count: parseInt(e.target.value)})} className="flex-1 ml-4 accent-indigo-600" />
                                <input type="number" min="1" max="100" value={config.count} onChange={e=>setConfig({...config, count: parseInt(e.target.value) || 1})} className="w-24 p-3 bg-white border-2 border-slate-200 rounded-xl font-black text-2xl text-center text-indigo-600 outline-none focus:border-indigo-500" />
                            </div>
                        </div>

                        <button onClick={()=>startTrial(config)} className="w-full bg-emerald-500 text-white py-6 rounded-[2rem] font-black text-2xl shadow-xl hover:bg-emerald-600 transition active:scale-95 flex items-center justify-center gap-3">
                            <Icon name="rocket" size={28}/> SİMÜLASYONU BAŞLAT
                        </button>
                    </div>
                </div>
            );
        };

        const Quiz = ({ questions, goBack, addToErrors, isNotebook }) => {
            const [idx, setIdx] = useState(0);
            const [show, setShow] = useState(false);
            const [score, setScore] = useState(0);
            const q = questions[idx];
            const handleAns = (i) => { if(show) return; setShow(true); if(i===q.ans) setScore(score+1); else addToErrors({q:q.q, w:q.opts[i], r:q.opts[q.ans], e:q.exp, t: isNotebook?"Defter":"Deneme"}); };
            return (
                <div className="h-full flex flex-col bg-slate-50 p-6 anim-fade">
                    <div className="flex justify-between items-center mb-6"><button onClick={goBack} className="text-slate-400 font-bold">Çıkış</button><div className="bg-white px-4 py-2 rounded-full font-bold shadow-sm text-indigo-600">{idx+1}/{questions.length}</div></div>
                    <div className="flex-1 overflow-y-auto"><div className="bg-white p-8 rounded-3xl shadow-md border border-slate-100 mb-6"><p className="font-bold text-xl text-slate-800 leading-relaxed">{q.q}</p></div><div className="space-y-4">{q.opts.map((o,i)=><button key={i} onClick={()=>handleAns(i)} disabled={show} className={`w-full text-left p-5 rounded-2xl border-2 font-medium text-lg transition ${show?(i===q.ans?'border-emerald-500 bg-emerald-50 text-emerald-800':i!==q.ans&&'opacity-50'):'border-white bg-white hover:border-indigo-200'}`}>{o}</button>)}</div>{show && <div className="mt-10 p-8 bg-white border-4 border-indigo-200 rounded-[2rem] text-slate-800 shadow-2xl readable-text anim-fade" dangerouslySetInnerHTML={{__html: q.exp}}></div>}</div>
                    {show && <button onClick={()=>{if(idx<questions.length-1){setIdx(idx+1);setShow(false)}else{alert(`Sınav Bitti! Puan: ${score}`);goBack()}}} className="w-full bg-indigo-600 text-white py-4 rounded-2xl font-bold mt-4 shadow-lg text-lg">İleri</button>}
                </div>
            );
        };

        const Flashcards = ({ cards, goBack }) => {
            const [idx, setIdx] = useState(0);
            const [flipped, setFlipped] = useState(false);
            return (
                <div className="h-full flex flex-col bg-slate-100 p-6 anim-fade">
                    <div className="flex justify-between items-center mb-8"><button onClick={goBack} className="p-3 bg-white rounded-full shadow"><Icon name="x"/></button><span className="font-bold text-indigo-600 bg-white px-4 py-2 rounded-full shadow">{idx+1}/{cards.length}</span></div>
                    <div className="flex-1 w-full max-w-md mx-auto perspective-1000 mb-8" onClick={()=>setFlipped(!flipped)}><div className={`relative w-full h-full transition-transform duration-700 transform-style-3d cursor-pointer ${flipped?'rotate-y-180':''}`}><div className="absolute w-full h-full backface-hidden bg-white rounded-[2rem] shadow-2xl flex flex-col items-center justify-center p-10 border-b-8 border-indigo-500"><span className="text-xs font-black text-slate-300 uppercase tracking-widest mb-6">SORU</span><div className="text-3xl font-bold text-center text-slate-800">{cards[idx].front}</div></div><div className="absolute w-full h-full backface-hidden rotate-y-180 bg-gradient-to-br from-indigo-600 to-purple-700 text-white rounded-[2rem] shadow-2xl flex flex-col items-center justify-center p-10"><span className="text-xs font-black text-indigo-200 uppercase tracking-widest mb-6">CEVAP</span><div className="text-2xl font-medium text-center leading-relaxed">{cards[idx].back}</div></div></div></div>
                    <div className="flex gap-4 max-w-md mx-auto w-full"><button onClick={()=>{setIdx(Math.max(0,idx-1));setFlipped(false)}} disabled={idx===0} className="flex-1 bg-white py-4 rounded-2xl font-bold">Geri</button><button onClick={()=>{setIdx(Math.min(cards.length-1,idx+1));setFlipped(false)}} disabled={idx===cards.length-1} className="flex-1 bg-indigo-600 text-white py-4 rounded-2xl font-bold">İleri</button></div>
                </div>
            );
        };

        const App = () => {
            const [view, setView] = useState('dashboard');
            const [apiKey, setApiKey] = useState(localStorage.getItem('baris_key') || "");
            const [modelName, setModelName] = useState(localStorage.getItem('baris_model') || "gemini-2.5-flash-preview-09-2025");
            const [loading, setLoading] = useState(false);
            const [modalData, setModalData] = useState(null); 
            const [quizData, setQuizData] = useState([]);
            const [cardData, setCardData] = useState([]);
            const [errors, setErrors] = useState(JSON.parse(localStorage.getItem('baris_errors')||'[]'));
            const [notebook, setNotebook] = useState(false);

            // Sayaç: 12 Temmuz 2026
            const daysLeft = Math.ceil((new Date('2026-07-12') - new Date()) / (1000 * 60 * 60 * 24));
            useEffect(()=>{localStorage.setItem('baris_errors', JSON.stringify(errors))},[errors]);

            const handleAction = async (type, topic) => {
                if(!apiKey) return alert("Anahtar giriniz!");
                if(!modelName) return alert("Model adı giriniz!");
                if(type==='video') { setModalData({type:'video', topic}); return; }
                setLoading(true);
                try {
                    // ARKA PLANDA YAZILAN "OKUL ÖNCESİ ÖABT" VE "SINAVDA ÇIKMA İHTİMALİ YÜKSEK" GİZLİ PROMPTLARI (Dışarıdan Birebir Aynı, İçeriden Çok Daha Güçlü)
                    const prompt = type==='hap' ? `Konu: '${topic}'. KPSS ve Okul Öncesi ÖABT için sınavda çıkma ihtimali çok yüksek olan 5 kritik hap bilgi. HTML <strong>, <em> kullan.`:
                                   type==='ozet' ? `Konu: '${topic}'. Okul Öncesi ÖABT seviyesinde, sınavda atama getirecek detaylı özet. HTML <h3>, <strong> kullan.`:
                                   type==='card' ? `Konu: '${topic}'. Okul Öncesi ÖABT sınavında en çok karıştırılan 10 kart. JSON Array formatında: [{"front":"...", "back":"..."}]`:
                                   `Konu: '${topic}'. Okul Öncesi ÖABT sınavı formatında, tam ÖSYM zorluğunda 10 adet çoktan seçmeli soru hazırla. Zorluk: ÖABT/KPSS. Format: JSON Array olarak şu yapıda olsun: [{"q":"Soru metni","opts":["Seçenek1","Seçenek2","Seçenek3","Seçenek4","Seçenek5"],"ans":0,"exp":"Açıklama"}]. "ans" 0 ile 4 arasında sayı olmalı (0=A, 1=B...). Sadece JSON ver.`;
                    
                    const res = await callGoogle(apiKey, modelName, prompt + (type==='card'||type==='test'?'': ' HTML formatında ver.'), type==='card'||type==='test'?'json':'html');
                    
                    if(type==='hap'||type==='ozet') setModalData({type:'info', title:topic, content:res});
                    else if(type==='card') { setCardData(res); setView('flashcards'); }
                    else { setQuizData(res); setView('quiz'); }
                } catch(e) { alert("Bir hata oluştu. Lütfen tekrar dene."); console.error(e); } finally { setLoading(false); }
            };

            const startTrial = async (conf) => {
                if(!apiKey) return alert("Anahtar giriniz!"); 
                if(!modelName) return alert("Model adı giriniz!");
                setLoading(true);
                try {
                    const prompt = `Sen KPSS uzmanısın. ${conf.type} alanında, tam ${conf.count} adet deneme sorusu yaz. Stratejin: ${conf.strategy}. SADECE JSON GÖNDER. Format: [{"q":"Soru","opts":["A","B","C","D","E"],"ans":0,"exp":"Bu konuyu ZİHİN HARİTASI mantığıyla, HTML <strong>, <mark>, <ul> ve emojiler kullanarak detaylıca açıkla. Doğru ve yanlış cevapların nedenlerini net belirt. Akılda kalıcı hafıza çivisi ekle."}]`;
                    const res = await callGoogle(apiKey, modelName, prompt, 'json');
                    setQuizData(res); setView('quiz');
                } catch(e) { alert("Hata."); } finally { setLoading(false); }
            };

            return (
                <div className="h-screen bg-slate-50 text-slate-800 font-sans select-none">
                    {loading && <div className="fixed inset-0 z-[100] bg-white/95 flex flex-col items-center justify-center"><div className="loader mb-6"></div><p className="font-bold text-indigo-600 animate-pulse text-xl">Barış Hocam İçin Hazırlanıyor...</p></div>}
                    
                    {notebook && <SmartNotebook apiKey={apiKey} modelName={modelName} close={()=>setNotebook(false)}/>}
                    {modalData?.type === 'info' && <InfoModal data={modalData} close={()=>setModalData(null)}/>}
                    {modalData?.type === 'video' && <TeacherSelectModal topic={modalData.topic} close={()=>setModalData(null)}/>}

                    {view === 'dashboard' && <Dashboard apiKey={apiKey} setApiKey={setApiKey} modelName={modelName} setModelName={setModelName} changeView={setView} daysLeft={daysLeft} openNotebook={()=>setNotebook(true)}/>}
                    {view === 'syllabus' && <Syllabus apiKey={apiKey} modelName={modelName} goBack={()=>setView('dashboard')} onAction={handleAction}/>}
                    {view === 'trial_setup' && <TrialSetup goBack={()=>setView('dashboard')} startTrial={startTrial}/>}
                    {view === 'quiz' && <Quiz questions={quizData} goBack={()=>setView('dashboard')} addToErrors={err=>setErrors([err,...errors])} isNotebook={false}/>}
                    {view === 'flashcards' && <Flashcards cards={cardData} goBack={()=>setView('syllabus')}/>}
                    {view === 'errors' && <div className="h-full p-6 flex flex-col max-w-3xl mx-auto"><div className="flex justify-between items-center mb-6"><button onClick={()=>setView('dashboard')}><Icon name="arrow-left"/></button><h2 className="font-bold text-2xl text-red-600">Hatalar</h2><button onClick={()=>setErrors([])}>Temizle</button></div><div className="flex-1 overflow-y-auto space-y-4">{errors.map((e,i)=><div key={i} className="bg-white p-6 rounded-2xl border-l-8 border-red-500 shadow"><div className="font-bold">{e.q}</div><div className="text-red-600">Sen: {e.w}</div><div className="text-emerald-600">Doğru: {e.r}</div><div className="text-sm mt-2">{e.e}</div></div>)}</div></div>}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
